var KEY = 'npif-progress-v1';
var S = { solved: {}, boards: {}, seen: {}, hints: {}, opts: { shade: true, ghosts: true } };
function load() {
  try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.boards) S = o; } } catch (e) { /* storage unavailable */ }
  S.opts = S.opts || { shade: true, ghosts: true };
  S.hints = S.hints || {}; S.seen = S.seen || {};
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }
function board(c) {
  var b = S.boards[c.nr];
  if (!b) {
    b = { g: [], done: [], snap: 0 };
    for (var t = 0; t < c.T; t++) b.g.push({ f: {}, x: [], m: {} });
    S.boards[c.nr] = b;
  }
  b.g.forEach(function (g) { if (!g.m) g.m = {}; });
  return b;
}
var ui = { view: 'home', nr: 0, level: 0, tool: { kind: 'fig', f: 0 }, mode: 'sure', showBroken: false, result: null,
  undo: {}, confirmReset: false, lastHint: null, confirmHint: false };

/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */
var $view = document.getElementById('npif-view');
var $modal = document.getElementById('npif-modal');
function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function paras(t) { return t.split(/\n\n+/).map(function (p) { return '<p>' + esc(p.trim()) + '</p>'; }).join(''); }
function hue(name) { var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360; return h; }
function personStyle(p) {
  if (p.role === 'santa') return '--tk:#D9342B;--tk-ink:#fff';
  if (p.role === 'frost') return '--tk:#7EC8E3;--tk-ink:#16324a';
  return '--tk:hsl(' + hue(p.name) + ',55%,78%);--tk-ink:#2B2B3A';
}
function token(c, f, cls) {
  var P = c.people.length;
  if (f === P) {
    return '<span class="tok tok-target ' + (cls || '') + '" title="' + esc(c.target) + '">' +
      (c.targetImg ? '<img src="assets/' + esc(c.targetImg) + '" alt="">' : '<b>T</b>') + '</span>';
  }
  var p = c.people[f];
  return '<span class="tok ' + (cls || '') + '" style="' + personStyle(p) + '" title="' + esc(p.name) + '">' +
    (p.img ? '<img src="assets/' + esc(p.img) + '" alt="">' : '<b>' + esc(p.kz) + '</b>') + '</span>';
}
function tagTime(text) {
  var m = /^\[(Incident|Discovery)\]\s*/.exec(text);
  if (!m) return esc(text);
  return '<span class="when when-' + m[1].toLowerCase() + '">' + m[1] + '</span> ' + esc(text.slice(m[0].length));
}
function clueIcon(k) {
  var stem = k.indexOf('cam') === 0 ? 'icons/camera' : k === 'room_count' ? 'icons/door-log' : null;
  if (!stem) return '';
  var a = asset(stem);
  return a ? '<img class="hicon" src="' + esc(a) + '" alt="' + (stem === 'icons/camera' ? 'Camera' : 'Door log') + '"> '
    : '<span class="chip">' + (stem === 'icons/camera' ? 'CAM' : 'LOG') + '</span> ';
}
function asset(stem) { return D.img[stem] ? 'assets/' + D.img[stem] : null; }
function pic(stem, cls, label) {
  var a = asset(stem);
  if (a) return '<img class="' + cls + '" src="' + esc(a) + '" alt="">';
  if (!label) return '';
  return '<div class="ph ' + cls + '"><span>' + esc(label) + '</span><small>assets/' + esc(stem) + '.png</small></div>';
}
function emblem(lv, cls) {
  var a = asset('icons/level-' + lv);
  return a ? '<img class="emblem ' + (cls || '') + '" src="' + esc(a) + '" alt="Level ' + lv + '">' : '<span class="lvbadge ' + (cls || '') + '">' + lv + '</span>';
}
function badgeMark(col) {
  var a = asset('icons/badge-' + col.toLowerCase());
  return a ? '<img class="badge-img" src="' + esc(a) + '" alt="">' : '<i style="background:' + (D.badgeColors[col] || '#999') + '"></i>';
}
function guideLink(lv, text) {
  var i = D.guideLevel[lv];
  return i === undefined ? '' : '<a class="btn btn-small" href="#guide' + i + '">' + esc(text) + '</a>';
}
function solvedCount() { return Object.keys(S.solved).length; }
/* where "next" leads: the next case, or the intro of the next level */
function nextLink(c) {
  var idx = D.cases.indexOf(c), nx = D.cases[idx + 1];
  if (!nx) return { href: '#vault', label: 'Open the vault', short: 'Vault' };
  if (nx.level !== c.level) {
    var ch = D.chapters.filter(function (x) { return x.level === nx.level; })[0];
    return { href: '#level' + nx.level, label: 'On to level ' + nx.level + ': ' + (ch ? ch.levelName : ''), short: 'Level ' + nx.level };
  }
  return { href: '#case' + pad(nx.nr), label: 'Next case', short: pad(nx.nr) };
}
function hintState(nr) { return S.hints[nr] || (S.hints[nr] = { seen: 0, used: 0, skip: [] }); }
var HINT_CACHE = {};
function hintSteps(c) {
  if (!HINT_CACHE[c.nr]) HINT_CACHE[c.nr] = JSON.parse(decrypt(c.hints, sha256(enc('npif-hint|' + c.nr))));
  return HINT_CACHE[c.nr];
}
function hintsUsed() {
  var n = 0; Object.keys(S.hints).forEach(function (k) { n += S.hints[k].used || 0; }); return n;
}
/* ranks live in the encrypted finale: they show up only after the vault is open */
function rankFor(ranks, n) {
  for (var i = 0; i < ranks.length; i++) if (n <= ranks[i].max) return i;
  return ranks.length - 1;
}
function caseState(nr) {
  if (S.solved[nr]) return 'solved';
  var b = S.boards[nr];
  if (b && b.g.some(function (g) { return Object.keys(g.f).length || g.x.length || (g.m && Object.keys(g.m).length); })) return 'started';
  return 'open';
}
function nextOpen() {
  for (var i = 0; i < D.cases.length; i++) if (!S.solved[D.cases[i].nr]) return D.cases[i].nr;
  return 0;
}
function go(hash) { if (location.hash === '#' + hash) route(); else location.hash = hash; }

/* ------------------------------------------------------------------ */
/* Views                                                               */
/* ------------------------------------------------------------------ */
function renderHome() {
  var nx = nextOpen();
  var h = '<section class="hero"><div class="hero-copy"><p class="eyebrow">A whodunnit logic puzzle file for the SANS Holiday Hack Challenge community</p>' +
    '<h1>' + esc(D.title) + '</h1><p class="lede">Thirty security incidents on Santa’s workshop floor. Work out where everybody stood, ' +
    'name the culprit, and collect one character of the vault password per case.</p><div class="hero-actions">' +
    (nx ? (function () {
        var cx = CASES[nx];
        if (!S.seen[cx.level]) return '<a class="btn btn-main" href="#level' + cx.level + '">' + (solvedCount() ? 'Continue with level ' + cx.level : 'Start with level 1') + '</a>';
        return '<a class="btn btn-main" href="#case' + pad(nx) + '">' + (solvedCount() ? 'Continue with case ' + pad(nx) : 'Start with case 01') + '</a>';
      })() : '<a class="btn btn-main" href="#vault">' + (S.vaultPw ? 'Read the finale' : 'Open the vault') + '</a>') +
    '<a class="btn" href="#guide">Read the guide</a></div></div>' +
    '<div class="hero-side">' + pic('chapters/cover', 'cover', 'cover picture') +
    '<div class="hero-vault" aria-label="Vault password progress"><p class="eyebrow">Sleigh vault</p>' + pwStrip(null) +
    '<p class="small">' + solvedCount() + ' of ' + D.pwLen + ' characters found \u00b7 ' + hintsUsed() + ' hints used</p></div></div></section>';
  h += '<section class="levels">';
  D.chapters.forEach(function (ch) {
    var cs = D.cases.filter(function (c) { return c.level === ch.level; });
    var done = cs.filter(function (c) { return S.solved[c.nr]; }).length;
    var c0 = cs[0];
    h += '<article class="level lv' + ch.level + '"><header>' + emblem(ch.level) + '<div><p class="eyebrow">Level ' + ch.level +
      ' · ' + c0.n + '×' + c0.n + ' · ' + c0.people.length + ' suspects</p><h2>' + esc(ch.levelName) + '</h2></div>' +
      '<a class="btn btn-small" href="#level' + ch.level + '">Briefing</a></header><ol class="tiles">';
    cs.forEach(function (c) {
      var st = caseState(c.nr);
      h += '<li><a class="tile ' + st + '" href="#case' + pad(c.nr) + '"><span class="tnr">' + pad(c.nr) + '</span><span class="ttl">' + esc(c.title) + '</span>' +
        '<span class="tst">' + (st === 'solved' ? '<b class="pwch">' + esc(S.solved[c.nr].ch) + '</b>' : st === 'started' ? 'in progress' : '') + '</span></a></li>';
    });
    h += '</ol><p class="small">' + done + ' of ' + cs.length + ' solved</p></article>';
  });
  h += '</section>';
  $view.innerHTML = h;
}

function pwStrip(active) {
  var h = '<div class="pw">';
  for (var g = 0; g < D.pwLen; g += 6) {
    h += '<div class="pwg' + (active === g / 6 + 1 ? ' on' : '') + '">';
    for (var i = g; i < Math.min(D.pwLen, g + 6); i++) {
      var c = D.cases.filter(function (x) { return x.code.pos === i + 1; })[0];
      var s = c && S.solved[c.nr];
      h += '<span class="pwc' + (s ? ' got' : '') + '" title="Character ' + (i + 1) + '">' + (s ? esc(s.ch) : '') + '<i>' + (i + 1) + '</i></span>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

function renderLevel(lv) {
  var ch = D.chapters.filter(function (x) { return x.level === lv; })[0];
  if (!ch) return go('');
  S.seen[lv] = true; save();
  var cs = D.cases.filter(function (c) { return c.level === lv; });
  var h = '<div class="levelview lv' + lv + '"><a class="back" href="#">← All cases</a>' +
    '<div class="lv-grid"><article class="chapter">' + pic('chapters/chapter-' + lv, 'chapterpic', 'chapter picture') +
    '<p class="eyebrow">The story so far</p><h1>' + esc(ch.title) + '</h1>' + paras(ch.story) + '</article>' +
    '<aside class="briefing"><div class="brhead">' + emblem(lv, 'large') + '<div><p class="eyebrow">Level ' + lv + '</p><h2>' + esc(ch.levelName) + '</h2></div></div>' +
    '<h3>How to solve this level</h3>' + paras(ch.briefing) + '<p class="lvacts">' + (function () {
      var first = cs.filter(function (c) { return !S.solved[c.nr]; })[0] || cs[0];
      return '<a class="btn btn-main" href="#case' + pad(first.nr) + '">' + (S.solved[first.nr] ? 'Replay' : (first === cs[0] ? 'Start' : 'Continue with')) + ' case ' + pad(first.nr) + '</a> ';
    })() + guideLink(lv, 'Read the full chapter in the guide') + '</p>' +
    '<ol class="tiles">';
  cs.forEach(function (c) {
    var st = caseState(c.nr);
    h += '<li><a class="tile ' + st + '" href="#case' + pad(c.nr) + '"><span class="tnr">' + pad(c.nr) + '</span><span class="ttl">' + esc(c.title) + '</span><span class="tst">' +
      (st === 'solved' ? '<b class="pwch">' + esc(S.solved[c.nr].ch) + '</b>' : st === 'started' ? 'in progress' : '') + '</span></a></li>';
  });
  h += '</ol></aside></div></div>';
  $view.innerHTML = h;
}

function renderCase() {
  var c = CASES[ui.nr];
  if (!c) return go('');
  var b = board(c), P = c.people.length, solved = S.solved[c.nr];
  var t = c.T > 1 ? (b.snap || 0) : 0;
  var idx = D.cases.indexOf(c), prev = D.cases[idx - 1], next = D.cases[idx + 1];
  var broken = ui.showBroken && ui.result ? ui.result : null;
  var byPerson = {}, other = [];
  c.clues.forEach(function (h) { var a = h.c.a; if (a >= 0 && a < P) (byPerson[a] = byPerson[a] || []).push(h); else other.push(h); });
  var stmt = {}; c.statements.forEach(function (s) { stmt[s.who] = s; });

  var LH = ui.lastHint && ui.lastHint.nr === c.nr ? ui.lastHint : null;
  function clueLi(h) {
    var done = b.done.indexOf(h.nr) >= 0, bad = broken && broken.broken.indexOf(h.nr) >= 0;
    var hl = LH && LH.clues.indexOf(h.nr) >= 0;
    return '<li><button type="button" class="clue' + (done ? ' done' : '') + (bad ? ' bad' : '') + (hl ? ' hinted' : '') + '" data-clue="' + h.nr + '" aria-pressed="' + done + '">' +
      '<span class="cnr">' + h.nr + '</span><span class="ctx">' + clueIcon(h.c.k) + tagTime(h.text) + '</span></button></li>';
  }

  var h = '<div class="caseview lv' + c.level + '">';
  h += '<nav class="crumbs"><a href="#">All cases</a><span>/</span><a href="#level' + c.level + '">Level ' + c.level + ' · ' + esc(c.levelName) + '</a>' +
    guideLink(c.level, 'Rules of this level') + '<span class="spacer"></span>' + (prev ? '<a class="btn btn-small" href="#case' + pad(prev.nr) + '" aria-label="Previous case">← ' + pad(prev.nr) + '</a>' : '') +
    (function () { var nl = nextLink(c); return '<a class="btn btn-small" href="' + nl.href + '" aria-label="' + esc(nl.label) + '">' + esc(nl.short) + ' →</a>'; })() + '</nav>';
  h += '<header class="casehead"><span class="casenr"><small>Case</small>' + pad(c.nr) + '</span><div><h1>' + esc(c.title) + '</h1>' +
    '<p class="small">Level ' + c.level + ' · ' + esc(c.levelName) + (solved ? ' · <span class="solvedtag">Solved · ' + esc(solved.culprit) + '</span>' : '') + '</p></div>' +
    emblem(c.level, 'head') + '</header>';

  h += '<div class="casegrid"><section class="dossier" aria-label="Case file">';
  h += '<div class="story"><figure class="target">' + (c.targetImg ? '<img src="assets/' + esc(c.targetImg) + '" alt="">' :
    '<div class="ph"><span>target</span><small>assets/targets/case-' + pad(c.nr) + '.png</small></div>') +
    '<figcaption><small>Target</small>' + esc(c.target) + '</figcaption></figure>' + paras(c.story) + '</div>';
  if (c.statements.length) {
    h += '<p class="note"><b>Statements</b> (speech bubbles): Santa always tells the truth. Jack Frost always lies. Everyone else tells the truth, except the culprit. <b>Evidence</b> (numbered) is always true.</p>';
  }
  h += '<div class="suspects">';
  c.people.forEach(function (p, f) {
    var sel = ui.tool.kind === 'fig' && ui.tool.f === f;
    h += '<article class="suspect' + (sel ? ' sel' : '') + '"><button type="button" class="pick" data-pick="' + f + '" aria-label="Select ' + esc(p.name) + ' for placing">' + token(c, f, 'big') + '</button>' +
      '<div class="sbody"><h3>' + esc(p.name) + ' <span class="kz">' + esc(p.kz) + '</span></h3>' +
      (p.badge ? '<p class="badge">' + badgeMark(p.badge) + esc(p.badge) + ' badge</p>' : '');
    if (stmt[f]) {
      var bad = broken && broken.badStmt.indexOf(f) >= 0;
      h += '<p class="say' + (bad ? ' bad' : '') + (LH && LH.stm.indexOf(f) >= 0 ? ' hinted' : '') + '">“' + tagTime(stmt[f].text) + '”</p>';
    }
    h += (byPerson[f] ? '<ul class="clues">' + byPerson[f].map(clueLi).join('') + '</ul>' : (c.statements.length ? '' : '<p class="small muted">No clue of their own.</p>')) + '</div></article>';
  });
  h += '</div>';
  if (other.length) h += '<div class="box"><h3>' + (c.statements.length ? 'More evidence' : 'More clues') + '</h3><ul class="clues">' + other.map(clueLi).join('') + '</ul></div>';
  if (c.access) {
    h += '<div class="box"><h3>Access rights</h3><table class="access">';
    Object.keys(c.access).forEach(function (col) {
      h += '<tr><th><span class="badge">' + badgeMark(col) + esc(col) + '</span></th><td>' +
        c.access[col].map(function (r) { return esc(c.rooms[r].name); }).join(', ') + '</td></tr>';
    });
    h += '</table></div>';
  }
  h += '<p class="small muted">Tap a clue to tick it off.</p></section>';

  /* --- board --- */
  h += '<section class="board" aria-label="Floor map">';
  if (c.T > 1) {
    h += '<div class="snaps" role="tablist">' + [0, 1].map(function (i) {
      return '<button type="button" role="tab" aria-selected="' + (t === i) + '" class="snap s' + i + (t === i ? ' on' : '') + '" data-snap="' + i + '">' + snapName(c, i) + '</button>'; }).join('') +
      '<span class="small muted">The target stays put. Everyone else may move to an adjoining room.</span></div>';
  }
  h += '<div class="tray" role="toolbar" aria-label="Figures and tools">';
  for (var f = 0; f <= P; f++) {
    var placed = f === P ? b.g[0].f[P] !== undefined : b.g[t].f[f] !== undefined;
    var on = ui.tool.kind === 'fig' && ui.tool.f === f;
    h += '<button type="button" class="tool' + (on ? ' on' : '') + (placed ? ' placed' : '') + '" data-pick="' + f + '" title="' + esc(f === P ? 'Target: ' + c.target : c.people[f].name) + ' (key ' + (f === P ? 'T' : f + 1) + ')">' +
      token(c, f) + '<span class="tlabel">' + esc(f === P ? 'Target' : c.people[f].kz) + '</span></button>';
  }
  h += '<span class="sep"></span><button type="button" class="tool' + (ui.tool.kind === 'x' ? ' on' : '') + '" data-tool="x" title="Cross out a square (key X, or right-click)"><span class="tok tok-x">✕</span><span class="tlabel">Cross</span></button>' +
    '<button type="button" class="tool' + (ui.tool.kind === 'erase' ? ' on' : '') + '" data-tool="erase" title="Erase (key E)"><span class="tok tok-erase">⌫</span><span class="tlabel">Erase</span></button>' +
    '<span class="sep"></span><div class="modesw" role="group" aria-label="How a tap places the figure">' +
    '<button type="button" class="' + (ui.mode === 'sure' ? 'on' : '') + '" data-mode="sure" aria-pressed="' + (ui.mode === 'sure') + '" title="Place the figure for good">Sure</button>' +
    '<button type="button" class="' + (ui.mode === 'maybe' ? 'on' : '') + '" data-mode="maybe" aria-pressed="' + (ui.mode === 'maybe') + '" title="Note a possible square (key M, or Shift-click)">Maybe</button></div></div>' +
    (ui.mode === 'maybe' ? '<p class="small muted modehint">Maybe mode: tap squares to note where the selected figure could stand. Tap again to remove a note. Switch back to Sure to place it for good.</p>' : '');

  var tot = 56 + c.n * 100 + 10, off = 56 / tot * 100, sz = c.n * 100 / tot * 100;
  h += '<div class="mapwrap' + (solved ? ' locked' : '') + '"><div class="map">' + c.svg +
    '<div class="cells" style="left:' + off + '%;top:' + off + '%;width:' + sz + '%;height:' + sz + '%;grid-template-columns:repeat(' + c.n + ',1fr)">';
  var g = b.g[t], occ = {}, rowsUsed = {}, colsUsed = {};
  for (f = 0; f <= P; f++) {
    var z0 = f === P ? b.g[0].f[P] : g.f[f];
    if (z0 === undefined) continue;
    occ[z0] = f;
    var rr = Math.floor(z0 / c.n), cc = z0 % c.n;
    rowsUsed[rr] = (rowsUsed[rr] || 0) + 1; colsUsed[cc] = (colsUsed[cc] || 0) + 1;
  }
  var ghost = {};
  if (c.T > 1 && S.opts.ghosts) { var og = b.g[1 - t]; for (f = 0; f < P; f++) if (og.f[f] !== undefined) ghost[og.f[f]] = f; }
  var culpritCell = solved ? solved.cell : -1;
  for (var z = 0; z < c.n * c.n; z++) {
    var r = Math.floor(z / c.n), q = z % c.n, blk = isBlocked(c, z);
    var cls = 'cell' + (blk ? ' blk' : '');
    if (S.opts.shade && occ[z] === undefined && (rowsUsed[r] || colsUsed[q])) cls += ' ruled';
    if (occ[z] !== undefined && (rowsUsed[r] > 1 || colsUsed[q] > 1)) cls += ' clash';
    if (solved && t === 0 && z === culpritCell) cls += ' culprit';
    var inner = '';
    if (LH && LH.z === z && LH.t === t) cls += ' hintcell';
    if (occ[z] !== undefined) inner = token(c, occ[z], 'onmap');
    else if (g.x.indexOf(z) >= 0) inner = '<span class="xmark">✕</span>';
    else if (g.m[z] && g.m[z].length) inner = '<span class="marks">' + g.m[z].slice().sort().map(function (mf) { return markTok(c, mf); }).join('') + '</span>';
    if (ghost[z] !== undefined && occ[z] === undefined) inner += token(c, ghost[z], 'ghost');
    h += '<button type="button" class="' + cls + '" data-z="' + z + '" aria-label="' + cellName(c, z) + ', ' + esc(roomName(c, z)) +
      (blk ? ', blocked' : '') + (occ[z] !== undefined ? ', ' + esc(occ[z] === P ? c.target : c.people[occ[z]].name) : '') +
      (occ[z] === undefined && g.m[z] && g.m[z].length ? ', maybe ' + g.m[z].map(function (mf) { return mf === P ? 'target' : c.people[mf].kz; }).join(' ') : '') + '">' + inner + '</button>';
  }
  h += '</div></div></div>' + c.legend;

  var pc = placedCount(c, b);
  h += '<div class="controls"><button type="button" class="btn btn-small" data-act="undo"' + ((ui.undo[c.nr] || []).length && !solved ? '' : ' disabled') + '>Undo</button>' +
    '<button type="button" class="btn btn-small" data-act="clear"' + (solved ? ' disabled' : '') + '>Clear ' + (c.T > 1 ? 'this snapshot' : 'map') + '</button>' +
    '<label class="opt"><input type="checkbox" id="opt-shade" data-opt="shade"' + (S.opts.shade ? ' checked' : '') + '> Shade used rows and columns</label>' +
    (c.T > 1 ? '<label class="opt"><input type="checkbox" id="opt-ghosts" data-opt="ghosts"' + (S.opts.ghosts ? ' checked' : '') + '> Show the other snapshot faintly</label>' : '') + '</div>';

  if (solved) {
    h += '<div class="result ok"><p><b>Case closed.</b> ' + esc(solved.culprit) + ' did it. Character ' + c.code.pos + ' of the vault password is <b class="pwch big">' + esc(solved.ch) + '</b>.</p>' +
      '<div class="epi">' + paras(solved.epi || '') + '</div>' +
      (ui.confirmReset ? '<p>Clear this case and solve it again? <button type="button" class="btn btn-small" data-act="reset-yes">Yes, clear it</button> <button type="button" class="btn btn-small" data-act="reset-no">Keep it</button></p>'
        : '<button type="button" class="btn btn-small" data-act="reset">Solve again</button>') +
      ' <a class="btn btn-main btn-small" href="' + nextLink(c).href + '">' + esc(nextLink(c).label) + '</a>' + '</div>';
  } else {
