<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>North Pole Incident Files</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap"><style>[hidden]{display:none!important}body{margin:0}/* Layout: a case file on the desk. Dossier (story, suspects, clues) on the left,
   the floor plan with its token tray on the right, like the printed spread. */
:root{
  --bg:#EEF3F7; --surface:#FFFFFF; --surface-2:#F6F9FB; --ink:#232634; --muted:#5D6578; --line:#D3DCE5;
  --accent:#D9342B; --accent-ink:#FFFFFF; --pine:#2E8B57; --gold:#F2B134; --ice:#7EC8E3;
  --paper:#FFF4E0; --note:#E8F4FA; --bad:#C62D25; --bad-bg:#FDECEA; --ok:#23784A; --ok-bg:#E7F5EC;
  --lv1:#2E8B57; --lv2:#2F86AE; --lv3:#C2850F; --lv4:#D9342B; --lv5:#3B3F55;
  --shadow:0 1px 2px rgba(35,38,52,.08),0 6px 18px rgba(35,38,52,.07);
  --f-display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono","DejaVu Sans Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141824; --surface:#1C2232; --surface-2:#222A3C; --ink:#ECEFF5; --muted:#A1AABD; --line:#313B52;
  --accent:#FF5A4F; --accent-ink:#1A0D0C; --pine:#4CC487; --gold:#F5C25A; --ice:#8FD3EC;
  --paper:#2A2A2C; --note:#1D3140; --bad:#FF7A70; --bad-bg:#3A1E22; --ok:#5ED394; --ok-bg:#183326;
  --lv1:#4CC487; --lv2:#5BB2DA; --lv3:#E2A93A; --lv4:#FF5A4F; --lv5:#A9B0D0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141824; --surface:#1C2232; --surface-2:#222A3C; --ink:#ECEFF5; --muted:#A1AABD; --line:#313B52;
  --accent:#FF5A4F; --accent-ink:#1A0D0C; --pine:#4CC487; --gold:#F5C25A; --ice:#8FD3EC;
  --paper:#2A2A2C; --note:#1D3140; --bad:#FF7A70; --bad-bg:#3A1E22; --ok:#5ED394; --ok-bg:#183326;
  --lv1:#4CC487; --lv2:#5BB2DA; --lv3:#E2A93A; --lv4:#FF5A4F; --lv5:#A9B0D0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3); color-scheme:dark }

*{ box-sizing:border-box }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5 }
.lv1{ --lv:var(--lv1) } .lv2{ --lv:var(--lv2) } .lv3{ --lv:var(--lv3) } .lv4{ --lv:var(--lv4) } .lv5{ --lv:var(--lv5) }
h1,h2,h3{ font-family:var(--f-display); line-height:1.1; margin:0; text-wrap:balance; font-weight:800 }
p{ margin:0 }
a{ color:inherit }
:focus-visible{ outline:3px solid var(--ice); outline-offset:2px }
.shell{ max-width:1320px; margin:0 auto; padding-inline:16px; padding-block:0 32px }
.small{ font-size:.86rem } .muted{ color:var(--muted) }
.eyebrow{ font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--muted) }
.lede{ font-size:1.12rem; max-width:60ch }

/* top bar */
.topbar{ display:flex; align-items:center; gap:16px; padding-block:14px; flex-wrap:wrap }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; font-family:var(--f-display); font-weight:800; font-size:1.15rem }
.mark{ width:36px; height:36px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center;
  font-size:.92rem; letter-spacing:.02em; box-shadow:inset 0 0 0 3px rgba(255,255,255,.35) }
.topnav{ display:flex; gap:4px; margin-left:auto }
.topnav a{ text-decoration:none; padding:7px 12px; border-radius:999px; font-weight:700; color:var(--muted) }
.topnav a.on,.topnav a:hover{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow) }
.count{ font-family:var(--f-mono); font-size:.78rem; background:var(--surface-2); border-radius:999px; padding:1px 7px; margin-left:4px }
.foot{ margin-top:40px; font-size:.8rem; color:var(--muted); border-top:1px solid var(--line); padding-top:14px }

/* buttons */
.btn{ display:inline-flex; align-items:center; gap:6px; font:inherit; font-weight:700; text-decoration:none; cursor:pointer;
  border:2px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:9px 18px }
.btn:hover{ border-color:var(--ink) }
.btn-main{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
.btn-main:hover{ filter:brightness(1.06); border-color:var(--accent) }
.btn-small{ padding:5px 12px; font-size:.88rem }
.btn[disabled]{ opacity:.45; cursor:not-allowed; filter:none }
.back{ display:inline-block; margin-bottom:14px; font-weight:700; text-decoration:none; color:var(--muted) }

/* home */
.hero{ display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:28px; align-items:center; padding-block:26px 30px }
.hero h1{ font-size:clamp(2.2rem,5vw,3.6rem); color:var(--accent); margin:6px 0 12px }
.hero-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px }
.hero-vault{ background:var(--surface); border-radius:16px; padding:18px; box-shadow:var(--shadow); display:grid; gap:10px }
.pw{ display:flex; flex-wrap:wrap; gap:8px }
.pwg{ display:flex; gap:3px }
.pwc{ width:24px; height:34px; border:2px solid var(--line); border-radius:6px; position:relative; display:grid; place-items:center;
  font-family:var(--f-mono); font-weight:700; background:var(--surface-2) }
.pwc.got{ border-color:var(--pine); background:var(--ok-bg) }
.pwc i{ position:absolute; bottom:-15px; font-size:.58rem; font-style:normal; color:var(--muted) }
.hero-vault .pw{ padding-bottom:14px }
.levels{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr)); gap:18px }
.level{ background:var(--surface); border-radius:16px; padding:16px; box-shadow:var(--shadow); border-top:6px solid var(--lv); display:grid; gap:12px; align-content:start }
.level header{ display:flex; align-items:center; gap:12px }
.level header .btn{ margin-left:auto }
.lvbadge{ width:42px; height:42px; border-radius:50%; background:var(--lv); color:#fff; font-family:var(--f-display); font-weight:800; font-size:1.4rem; display:grid; place-items:center; flex:none }
.level h2{ font-size:1.5rem }
.tiles{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
.tile{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center; text-decoration:none; padding:9px 10px;
  border:2px solid var(--line); border-radius:var(--r); background:var(--surface-2); min-height:52px }
.tile:hover{ border-color:var(--lv) }
.tnr{ font-family:var(--f-mono); font-weight:700; font-size:.82rem; color:var(--lv) }
.ttl{ font-weight:700; font-size:.92rem; line-height:1.2 }
.tst{ font-size:.72rem; color:var(--muted) }
.tile.started{ border-style:dashed; border-color:var(--lv) }
.tile.solved{ background:var(--ok-bg); border-color:transparent }
.pwch{ font-family:var(--f-mono); font-weight:700; color:var(--ok); border:2px solid currentColor; border-radius:6px; padding:0 6px; font-size:.95rem }
.pwch.big{ font-size:1.3rem } .pwch.huge{ font-size:3rem; padding:4px 18px; border-width:3px; border-radius:12px }

/* level view */
.lv-grid{ display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:24px; align-items:start }
.chapter{ background:var(--surface); border-radius:16px; padding:26px; box-shadow:var(--shadow); display:grid; gap:12px; font-size:1.06rem }
.chapter h1{ font-size:2.1rem; margin-bottom:4px }
.briefing{ background:var(--surface); border-radius:16px; padding:22px; box-shadow:var(--shadow); border-top:6px solid var(--lv); display:grid; gap:10px }
.briefing h2{ font-size:1.9rem; color:var(--lv) } .briefing h3{ font-size:1.15rem; margin-top:4px }

/* case view */
.crumbs{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.9rem; color:var(--muted); margin-bottom:12px }
.crumbs a{ font-weight:700; text-decoration:none } .crumbs .spacer{ flex:1 }
.casehead{ display:flex; gap:14px; align-items:center; margin-bottom:16px }
.casenr{ background:var(--lv); color:#fff; font-family:var(--f-display); font-weight:800; font-size:2rem; line-height:1; border-radius:12px;
  padding:6px 12px 8px; text-align:center; flex:none }
.casenr small{ display:block; font-family:var(--f-body); font-size:.6rem; letter-spacing:.2em; text-transform:uppercase }
.casehead h1{ font-size:clamp(1.6rem,3.4vw,2.4rem) }
.solvedtag{ color:var(--ok); font-weight:700 }
.casegrid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:22px; align-items:start }
.dossier{ display:grid; gap:12px; min-width:0 }
.story{ background:var(--paper); border-radius:14px; padding:16px 18px; display:grid; gap:8px }
.note{ background:var(--note); border-radius:10px; padding:10px 14px; font-size:.9rem }
.suspects{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:10px }
.suspect{ display:flex; gap:10px; background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:10px; min-width:0 }
.suspect.sel{ border-color:var(--lv) }
.suspect h3{ font-size:1.1rem; display:flex; justify-content:space-between; gap:6px }
.sbody{ min-width:0; flex:1; display:grid; gap:4px; align-content:start }
.kz{ font-family:var(--f-mono); font-size:.72rem; border:1.5px solid var(--muted); border-radius:5px; padding:0 4px; height:fit-content; color:var(--muted) }
.pick{ background:none; border:0; padding:0; cursor:pointer; align-self:flex-start; border-radius:50% }
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:.82rem; font-weight:700 }
.badge i{ width:11px; height:15px; border-radius:3px; border:1.5px solid var(--ink); display:inline-block }
.say{ background:var(--surface-2); border:2px solid var(--gold); border-radius:12px; padding:6px 10px; font-style:italic; font-size:.93rem }
.say.bad{ border-color:var(--bad); background:var(--bad-bg) }
.clues{ list-style:none; margin:0; padding:0; display:grid; gap:3px }
.clue{ display:flex; gap:8px; align-items:baseline; width:100%; text-align:left; font:inherit; font-size:.93rem; line-height:1.35; color:inherit;
  background:none; border:0; border-radius:8px; padding:4px 6px; cursor:pointer }
.clue:hover{ background:var(--surface-2) }
.cnr{ flex:none; min-width:22px; height:22px; border-radius:11px; background:var(--ink); color:var(--surface); font-size:.72rem; font-weight:700;
  display:inline-grid; place-items:center; position:relative; top:-1px }
.clue.done .ctx{ text-decoration:line-through; color:var(--muted) }
.clue.done .cnr{ background:var(--muted) }
.clue.bad{ background:var(--bad-bg) } .clue.bad .cnr{ background:var(--bad) }
.chip{ font-size:.66rem; font-weight:700; letter-spacing:.06em; border:1.5px solid currentColor; border-radius:4px; padding:0 4px }
.when{ font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; border-radius:4px; padding:1px 5px; color:#fff; font-style:normal }
.when-incident{ background:#C62D25 } .when-discovery{ background:#2F86AE }
.box{ background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:12px 14px; display:grid; gap:6px }
.box h3{ font-size:1.05rem }
.access{ border-collapse:collapse; font-size:.9rem } .access th{ text-align:left; padding:3px 12px 3px 0; white-space:nowrap; vertical-align:top } .access td{ padding:3px 0 }

/* tokens */
.tok{ --tk:#ccc; --tk-ink:#232634; width:34px; height:34px; border-radius:50%; background:var(--tk); color:var(--tk-ink); display:inline-grid; place-items:center;
  font-weight:700; font-size:.82rem; border:2.5px solid #2B2B3A; overflow:hidden; flex:none; font-family:var(--f-body) }
.tok img{ width:100%; height:100%; object-fit:cover }
.tok.big{ width:56px; height:56px; font-size:1.05rem }
.tok-target{ background:#F2B134; color:#2B2B3A; border-radius:8px; transform:rotate(45deg) scale(.86) }
.tok-target b,.tok-target img{ transform:rotate(-45deg) }
.tok-x,.tok-erase{ background:var(--surface-2); color:var(--ink); border-color:var(--muted); font-size:1rem }

/* board */
.board{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); display:grid; gap:10px; min-width:0;
  background:var(--surface); border-radius:16px; padding:14px; box-shadow:var(--shadow) }
.snaps{ display:flex; gap:8px; align-items:center; flex-wrap:wrap }
.snap{ font:inherit; font-weight:700; border:2px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:999px; padding:6px 14px; cursor:pointer }
.snap.s0.on{ background:#C62D25; border-color:#C62D25; color:#fff } .snap.s1.on{ background:#2F86AE; border-color:#2F86AE; color:#fff }
.tray{ display:flex; flex-wrap:wrap; gap:6px; align-items:center }
.tool{ display:grid; justify-items:center; gap:2px; background:var(--surface-2); border:2px solid transparent; border-radius:12px; padding:5px 6px 3px; cursor:pointer; color:var(--ink); font:inherit }
.tool.on{ border-color:var(--lv); background:var(--surface) }
.tool.placed .tok{ opacity:.45 }
.tlabel{ font-size:.66rem; font-weight:700; font-family:var(--f-mono) }
.sep{ width:1px; align-self:stretch; background:var(--line); margin-inline:4px }
.mapwrap{ background:#FFFFFF; border-radius:12px; padding:6px }
.map{ position:relative; width:100%; max-width:640px; margin:0 auto }
.map svg{ display:block; width:100%; height:auto }
.cells{ position:absolute; display:grid; grid-auto-rows:1fr }
.cell{ position:relative; border:0; padding:0; margin:0; background:transparent; cursor:pointer; display:grid; place-items:center; color:#2B2B3A }
.cell:hover{ background:rgba(126,200,227,.28) }
.cell.blk{ cursor:not-allowed } .cell.blk:hover{ background:rgba(198,45,37,.12) }
.cell.ruled{ background:repeating-linear-gradient(135deg,rgba(43,43,58,.13) 0 3px,transparent 3px 9px) }
.cell .tok.onmap{ width:72%; height:72%; font-size:clamp(.6rem,1.6vw,.95rem); box-shadow:0 2px 0 rgba(0,0,0,.25) }
.cell .tok-target.onmap{ width:62%; height:62% }
.cell.clash .tok{ border-color:#C62D25; box-shadow:0 0 0 3px rgba(198,45,37,.45) }
.cell.culprit{ box-shadow:inset 0 0 0 4px #C62D25 }
.xmark{ font-size:clamp(1rem,3vw,1.9rem); color:#C62D25; font-weight:700; line-height:1 }
.tok.ghost{ position:absolute; right:6%; bottom:6%; width:34%; height:34%; opacity:.5; font-size:.55rem; border-width:1.5px; box-shadow:none }
.cell.nope{ animation:nope .3s }
@keyframes nope{ 25%{ transform:translateX(-3px) } 75%{ transform:translateX(3px) } }
.mapwrap.locked .cell{ cursor:default }
.controls{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center }
.opt{ display:flex; gap:6px; align-items:center; font-size:.86rem; cursor:pointer }
.checkrow{ display:flex; gap:12px; align-items:center; flex-wrap:wrap }
.result{ border-radius:12px; padding:12px 14px; display:grid; gap:8px }
.result.bad{ background:var(--bad-bg); color:var(--ink); border-left:5px solid var(--bad) }
.result.ok{ background:var(--ok-bg); border-left:5px solid var(--ok) }
.result ul{ margin:0; padding-left:20px }
.epi{ display:grid; gap:6px; font-style:italic }
.codegrid{ display:grid; gap:6px }
.codegrid h3{ font-size:1.05rem }
.codegrid table{ border-collapse:collapse; font-family:var(--f-mono); justify-self:start; width:auto }
.codegrid td{ width:30px; height:30px; text-align:center; border:1.5px solid var(--line); font-weight:700; font-size:1rem }
.codegrid th{ font-size:.7rem; color:var(--muted); width:20px; font-family:var(--f-body) }
.codegrid td.hit{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok) }

/* modal */
.modal{ position:fixed; inset:0; background:rgba(15,18,28,.55); display:grid; place-items:center; padding:16px; z-index:20 }
.modal-card{ background:var(--surface); border-radius:18px; padding:24px; max-width:560px; width:100%; display:grid; gap:14px; border-top:8px solid var(--lv);
  box-shadow:0 20px 60px rgba(0,0,0,.35); animation:pop .25s ease-out }
.modal-card h2{ font-size:2rem }
.reveal{ display:grid; justify-items:center; gap:6px; background:var(--surface-2); border-radius:14px; padding:14px }
@keyframes pop{ from{ transform:scale(.94); opacity:.4 } }

/* vault */
.vaultview{ display:grid; gap:12px }
.vaultview h1{ font-size:clamp(1.8rem,4vw,2.6rem) }
.vault{ display:grid; gap:14px; justify-items:start; background:var(--surface); border-radius:16px; padding:18px; box-shadow:var(--shadow) }
.pwin{ display:flex; flex-wrap:wrap; gap:6px; padding-bottom:12px }
.pwbox{ position:relative }
.pwbox input{ width:34px; height:44px; text-align:center; font-family:var(--f-mono); font-size:1.15rem; font-weight:700; border:2px solid var(--line); border-radius:8px;
  background:var(--surface-2); color:var(--ink) }
.pwbox input[readonly]{ border-color:var(--pine); background:var(--ok-bg) }
.pwbox i{ position:absolute; left:0; right:0; bottom:-15px; text-align:center; font-size:.6rem; font-style:normal; color:var(--muted) }
.pwbox:nth-child(6n){ margin-right:10px }
.shake{ animation:nope .35s }

/* guide */
.guideview{ display:grid; gap:16px }
.controls-help{ background:var(--note); border-radius:14px; padding:16px 18px }
.controls-help h2{ font-size:1.4rem; margin-bottom:6px } .controls-help ul{ margin:0; padding-left:20px; display:grid; gap:4px }
kbd{ font-family:var(--f-mono); font-size:.8rem; border:1.5px solid var(--muted); border-bottom-width:3px; border-radius:5px; padding:0 5px; background:var(--surface) }
.guide{ background:var(--surface); border-radius:16px; padding:clamp(16px,4vw,36px); box-shadow:var(--shadow); max-width:860px; line-height:1.6; min-width:0 }
.guide h1{ font-size:2.4rem; color:var(--accent) }
.guide h2{ font-size:1.7rem; margin:34px 0 10px; padding-bottom:6px; border-bottom:3px solid var(--accent) }
.guide h1 + h2{ border:0; margin-top:6px; color:var(--muted); font-size:1.3rem }
.guide h3{ font-size:1.25rem; margin:22px 0 6px }
.guide p,.guide ul,.guide ol{ margin:0 0 10px } .guide li{ margin-bottom:4px }
.guide table{ border-collapse:collapse; width:100%; font-size:.92rem; margin:8px 0 16px; display:block; overflow-x:auto }
.guide th{ background:var(--ink); color:var(--surface); text-align:left; padding:6px 9px }
.guide td{ border-bottom:1px solid var(--line); padding:6px 9px; vertical-align:top }
.guide code{ font-family:var(--f-mono); font-size:.88em; background:var(--surface-2); border-radius:4px; padding:0 4px }
.guide pre{ font-family:var(--f-mono); font-size:.8rem; background:var(--surface-2); border-radius:10px; padding:12px; overflow-x:auto }
.guide .beispiel{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; background:var(--paper); border-radius:14px; padding:14px; margin:8px 0 16px }
.guide .beispiel .karte{ width:100%; height:auto; background:#fff; border-radius:8px }
.guide .beispiel h4{ font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:8px 0 2px }
.guide .beispiel ul,.guide .beispiel ol{ font-size:.92rem }
.guide .sym{ width:44px; height:44px; vertical-align:middle }
.guide .lgcode{ font-style:normal; font-family:var(--f-mono); font-size:.8rem; font-weight:700; border-radius:4px; padding:1px 5px }
.guide .lgcode.blk{ background:#2B2B3A; color:#fff } .guide .lgcode.frei{ border:1.5px dashed var(--muted) }
.guide .lgbild{ width:40px; height:40px; object-fit:contain }

@media (max-width: 900px){
  .hero,.lv-grid,.casegrid{ grid-template-columns:minmax(0,1fr) }
  .board{ position:static }
  .guide .beispiel{ grid-template-columns:minmax(0,1fr) }
}
@media (max-width: 480px){
  .tiles{ grid-template-columns:minmax(0,1fr) }
  .bname{ display:none }
  .tok.big{ width:46px; height:46px }
  .tool{ padding:4px 3px 2px } .tool .tok{ width:30px; height:30px }
  .codegrid td{ width:26px; height:26px }
}
@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important } }

/* image slots: own pictures from assets/, otherwise a labelled placeholder */
.ph{ border:2px dashed var(--muted); border-radius:12px; background:repeating-linear-gradient(45deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px; color:var(--muted);
  font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; padding:8px }
.ph small{ font-family:var(--f-mono); font-size:.66rem; letter-spacing:0; text-transform:none; font-weight:500; word-break:break-all }
.hero-side{ display:grid; gap:14px; min-width:0 }
.cover{ width:100%; max-width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:16px; box-shadow:var(--shadow) }
.chapterpic{ width:100%; max-width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:12px }
.vaultview .chapterpic{ max-height:340px }
.emblem{ width:42px; height:42px; object-fit:contain; flex:none }
.emblem.large,.lvbadge.large{ width:84px; height:84px; font-size:2.4rem }
.emblem.head,.lvbadge.head{ width:56px; height:56px; font-size:1.6rem; margin-left:auto }
.brhead{ display:flex; align-items:center; gap:14px }
.story{ display:block } .story p + p{ margin-top:8px }
.story::after{ content:""; display:block; clear:both }
.target{ float:right; width:min(38%,150px); margin:0 0 8px 14px; text-align:center }
.target img,.target .ph{ width:100%; aspect-ratio:1; object-fit:contain; background:var(--surface); border-radius:12px; display:flex }
.target .ph{ font-size:.66rem }
.target figcaption{ font-weight:700; font-size:.86rem; line-height:1.2; margin-top:4px }
.target figcaption small{ display:block; font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--lv) }
.badge-img{ height:18px; width:auto }
.hicon{ height:18px; width:18px; object-fit:contain; vertical-align:-3px }

/* map legend (same markup as the print version) */
.legende{ display:flex; flex-wrap:wrap; gap:8px 22px; font-size:.86rem; border-top:1px solid var(--line); padding-top:10px }
.lg{ min-width:0 } .lg.breit{ flex-basis:100% }
.lg h4{ margin:0 0 4px; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted) }
.lgzeile{ display:flex; flex-wrap:wrap; gap:4px 14px }
.lgi{ display:inline-flex; align-items:center; gap:6px }
.lgzeile.kam .lgi{ font-family:var(--f-mono); font-size:.76rem }
.swatch{ width:20px; height:20px; border-radius:4px; flex:none }
.lgbild{ width:26px; height:26px; object-fit:contain }
.lgcode{ font-style:normal; font-family:var(--f-mono); font-size:.74rem; font-weight:700; border-radius:4px; padding:1px 5px }
.lgcode.blk{ background:#2B2B3A; color:#fff } .lgcode.frei{ border:1.5px dashed var(--muted); font-style:italic } .lgcode.kamc{ background:#C62D25; color:#fff }

/* guide: chapters with a table of contents */
.gwrap{ display:grid; grid-template-columns:240px minmax(0,1fr); gap:22px; align-items:start }
.toc{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); background:var(--surface); border-radius:14px; padding:14px; box-shadow:var(--shadow) }
.toc ol{ list-style:none; margin:6px 0 0; padding:0; display:grid; gap:2px }
.toc a{ display:block; text-decoration:none; padding:5px 8px; border-radius:8px; font-size:.9rem; line-height:1.25 }
.toc a:hover{ background:var(--surface-2) }
.toc a[aria-current="page"]{ background:var(--accent); color:var(--accent-ink); font-weight:700 }
.guide > h2:first-child{ margin-top:0 }
.gnav{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; border-top:1px solid var(--line); margin-top:26px; padding-top:16px }
@media (max-width: 900px){
  .gwrap{ grid-template-columns:minmax(0,1fr) }
  .toc{ position:static }
  .toc ol{ grid-template-columns:repeat(auto-fill,minmax(180px,1fr)) }
}

/* maybe-notes on the map */
.modesw{ display:inline-flex; border:2px solid var(--line); border-radius:999px; overflow:hidden; align-self:center }
.modesw button{ font:inherit; font-weight:700; font-size:.82rem; border:0; background:var(--surface-2); color:var(--muted); padding:6px 12px; cursor:pointer }
.modesw button.on{ background:var(--lv); color:#fff }
.modehint{ margin-top:-4px }
.marks{ position:absolute; inset:22% 5% 5% 5%; display:flex; flex-wrap:wrap; align-content:flex-end; justify-content:center; gap:3px; pointer-events:none }
.mk{ --tk:#ccc; --tk-ink:#2B2B3A; font-style:normal; font-family:var(--f-mono); font-weight:700; font-size:clamp(.55rem,1.35vw,.82rem); line-height:1;
  background:var(--tk); color:var(--tk-ink); border:2px solid #2B2B3A; border-radius:999px; padding:3px 5px; box-shadow:0 1px 0 rgba(0,0,0,.25) }
.mk-t{ background:#F2B134; border-radius:3px }

/* hints */
.hints{ background:var(--surface-2); border-radius:12px; padding:12px 14px; display:grid; gap:8px }
.hhead{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap }
.hhead h3{ font-size:1.05rem }
.hcount{ font-size:.82rem; color:var(--muted); font-family:var(--f-mono) }
.hsteps{ margin:0; padding-left:22px; display:grid; gap:6px; font-size:.92rem }
.hsteps li.latest{ font-weight:700 }
.hsteps li.skipped{ color:var(--muted) }
.hacts{ display:flex; gap:10px; align-items:center; flex-wrap:wrap }
.clue.hinted{ background:var(--note); box-shadow:inset 3px 0 0 var(--ice) }
.say.hinted{ border-color:var(--ice); box-shadow:0 0 0 3px var(--note) }
.cell.hintcell{ box-shadow:inset 0 0 0 4px #2F86AE; animation:hintpulse 1.2s ease-out 2 }
@keyframes hintpulse{ 50%{ box-shadow:inset 0 0 0 8px rgba(47,134,174,.45) } }
.lvacts{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }

/* finale */
.finale{ display:grid; gap:18px; margin-top:8px }
.finalepic{ max-height:none }
.rankcard{ display:flex; gap:20px; align-items:center; background:var(--surface); border-radius:16px; padding:22px; box-shadow:var(--shadow); border-top:8px solid var(--gold) }
.rankcard h2{ font-size:clamp(1.8rem,4vw,2.6rem); color:var(--accent) }
.rankcard > div:last-child{ display:grid; gap:6px; min-width:0 }
.medal{ width:110px; height:110px; flex:none; border-radius:50%; background:var(--gold); display:grid; place-items:center; box-shadow:inset 0 0 0 6px rgba(255,255,255,.45), 0 4px 0 #B5713A }
.medal span{ font-family:var(--f-display); font-weight:800; font-size:2.6rem; color:#2B2B3A }
.medal img{ width:100%; height:100%; object-fit:contain }
.letter{ background:var(--paper) } .letter .sign{ font-family:var(--f-display); font-size:1.5rem; font-weight:800 }
.statsbox{ background:var(--surface); border-radius:16px; padding:20px; box-shadow:var(--shadow); display:grid; gap:12px }
.statsbox h2,.ranklist h2,.closing h2{ font-size:1.5rem }
.stats{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr)); gap:10px }
.stat{ background:var(--surface-2); border-radius:12px; padding:12px; display:grid; gap:2px }
.stat b{ font-family:var(--f-display); font-size:1.6rem; line-height:1.1; overflow-wrap:anywhere }
.stat span{ font-size:.82rem; color:var(--muted) }
.ranklist{ background:var(--surface); border-radius:16px; padding:20px; box-shadow:var(--shadow) }
.ranklist ol{ list-style:none; margin:10px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); gap:4px 16px }
.ranklist li{ display:flex; gap:10px; align-items:baseline; padding:5px 8px; border-radius:8px; font-size:.92rem }
.ranklist li.you{ background:var(--accent); color:var(--accent-ink); font-weight:700 }
.rr{ font-family:var(--f-mono); font-size:.76rem; min-width:56px; color:inherit; opacity:.75 }
.rt{ flex:1 } .youtag{ font-size:.7rem; text-transform:uppercase; letter-spacing:.1em }
.lessons ol{ margin:0; padding-left:22px; display:grid; gap:14px }
.lessons h3{ font-size:1.1rem; margin-bottom:2px }
.lessons .cases{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px }
.lessons .cases a{ font-size:.78rem; text-decoration:none; border:1.5px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--muted) }
.jacknote{ background:var(--note); font-style:italic }
.closing{ display:grid; gap:10px; padding:4px 2px }
.share{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--surface); border:2px dashed var(--line); border-radius:12px; padding:10px 14px }
.share span{ flex:1; min-width:0 }
@media (max-width: 480px){ .rankcard{ flex-direction:column; text-align:center } .medal{ width:90px; height:90px } }

<script>window.NPIF={"title":"The North Pole Incident Files","subtitle":"30 whodunnit logic puzzles from the workshop floor","chapters":[{"level":1,"title":"Prologue: The Suggestion Box","story":"Day one. You are the newest member of the North Pole security team, which until this morning consisted of a suggestion box. Santa welcomes you with a mug of cocoa and a problem. Small things keep going wrong on the workshop floor: a stray USB stick here, an unlocked screen there. 'Probably nothing,' he says, in the voice of a man who has said 'probably nothing' before.\n\nThen he shows you the note. It was found frozen to the door of the sleigh vault, written in ice-blue ink: 'I have changed the password of your vault. It has thirty characters. You will find one under the feet of every fool who helps me. Catch all thirty, or the sleigh stays on the ground. Merry Christmas.' The note is unsigned. It smells of peppermint and smugness. The security team, meaning you, has no leads.","briefing":"Work out where everybody stood. For each person, note the squares their clues allow. In this level somebody is always down to exactly one square: place that person, cross out their row and column for everybody else, and look again. When all the people are placed, the target is on the one square whose row and column are still free. Whoever shares the target's room is the culprit. Guide: chapter 6.","levelName":"Recruit"},{"level":2,"title":"Chapter 2: I Don't Recall","story":"Six cases, six culprits, six characters of the password. Santa is delighted and promotes you to Responder, a title that comes with a lanyard and no extra pay.\n\nYou have noticed a pattern. Nobody meant any harm. Each of them was simply being helpful, and each remembers a friendly stranger who made a suggestion just beforehand: blue scarf, cold hands, very polite. Nobody remembers a face.\n\nWord of your success has spread, and with it a sudden outbreak of poor memory. Witnesses who last week could name the exact chair they sat on now 'think they were somewhere near the middle, possibly'. Some have nothing to say at all. You will have to make do with less.","briefing":"The clues get thinner. Some people have only a vague clue, some have none, and nobody may be down to one square at the start. When you are stuck, stop asking where a person can be and ask who can stand in a certain row or column. Every row and every column needs exactly one figure. If only one figure can still reach a row, that figure is in that row, however many other squares it seemed to have. Clues can now also say where somebody was not. Guide: chapter 7.","levelName":"Responder"},{"level":3,"title":"Chapter 3: Compared to What","story":"Twelve characters. The vault door has started to look less smug.\n\nThe elves, meanwhile, have discovered a new way of being unhelpful. Nobody wants to say which room they were in, in case it turns out to be the wrong one. So they describe themselves in terms of each other: 'I was further north than Pepper.' 'I was in the same room as Jingle, wherever that was.' It is like taking witness statements from a flock of birds.\n\nSanta promotes you to Analyst. And one name has now been on every single suspect list: Jack Frost, visiting consultant for 'seasonal optimization'. He is charming, he is cooperative, and he is always around. So far he has been guilty only some of the time, which is somehow worse.","briefing":"The map grows to six by six with five people, and most clues now compare two figures: further north than, in the same room as, the only person in the room. One such clue rarely places anybody. Turn each one into limits (X cannot be in the bottom row, Y cannot be in the top row) and let two or three clues squeeze the same person. The target may now appear in a comparison, but never in a clue about its room. Guide: chapter 8.","levelName":"Analyst"},{"level":4,"title":"Chapter 4: The Budget","story":"Eighteen characters, and something unheard of has happened: the security budget has been approved. Overnight the floor has acquired badge readers on the doors, colored access badges for everyone, door logs and a number of cameras, which the elves wave at.\n\nIt comes not a moment too soon. The incidents are no longer about forgotten printouts. Lists are being exported, cameras paused, firmware replaced. Somebody is working through the building with a plan.\n\nSanta promotes you to Investigator and hands you a badge of your own. It is Gold. Jack Frost congratulates you warmly and asks, in passing, which rooms a Gold badge can open.","briefing":"The map is now seven by seven with six people, and the new equipment gives you three new kinds of information. Badges: each person may only be in the rooms cleared for their badge color, so strike the forbidden rooms first. Cameras: each camera watches the squares listed for it, and a clue says whom it recorded, whom it did not, or how many. Door logs: the exact number of people in a room. Counting clues cut both ways: once a room is full, everybody else is out. And watch for pairs: if two people can only be in the same two rows, nobody else is in those rows. Guide: chapter 9.","levelName":"Investigator"},{"level":5,"title":"Chapter 5: Everybody Lies a Little","story":"Twenty-four characters. Christmas Eve is tomorrow, the vault is still shut, and the last six incidents are the worst yet: ransomware, forged keys, a blizzard indoors.\n\nThe mood on the floor has changed. Until now people left things out. Now, when they are guilty, they lie. One of them lies whether he is guilty or not: every word Jack Frost has said to you this week has turned out to be false, including 'good morning'. Santa, at least, remains incapable of it.\n\nThe new systems give you one advantage. For every incident you now have two pictures of the floor: the moment it happened and the moment it was discovered. Santa promotes you to Incident Commander. There is nobody left to be promoted above.","briefing":"Each case has two
