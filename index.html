stool.png","floors/lobby":"floors/lobby.png","floors/workshop":"floors/workshop.png","floors/wrapping-room":"floors/wrapping-room.png","floors/mail-room":"floors/mail-room.png","floors/server-room":"floors/server-room.png","floors/santas-office":"floors/santas-office.png","floors/security-office":"floors/security-office.png","floors/break-room":"floors/break-room.png","floors/meeting-room":"floors/meeting-room.png","floors/print-room":"floors/print-room.png","floors/archive":"floors/archive.png","floors/storage-room":"floors/storage-room.png","targets/case-01":"targets/case-01.png","targets/case-02":"targets/case-02.png","targets/case-03":"targets/case-03.png","targets/case-04":"targets/case-04.png","targets/case-05":"targets/case-05.png","targets/case-06":"targets/case-06.png","targets/case-07":"targets/case-07.png","targets/case-08":"targets/case-08.png","targets/case-09":"targets/case-09.png","targets/case-10":"targets/case-10.png","targets/case-11":"targets/case-11.png","targets/case-12":"targets/case-12.png","targets/case-13":"targets/case-13.png","targets/case-14":"targets/case-14.png","targets/case-15":"targets/case-15.png","targets/case-16":"targets/case-16.png","targets/case-17":"targets/case-17.png","targets/case-18":"targets/case-18.png","targets/case-19":"targets/case-19.png","targets/case-20":"targets/case-20.png","targets/case-21":"targets/case-21.png","targets/case-22":"targets/case-22.png","targets/case-23":"targets/case-23.png","targets/case-24":"targets/case-24.png","targets/case-25":"targets/case-25.png","targets/case-26":"targets/case-26.png","targets/case-27":"targets/case-27.png","targets/case-28":"targets/case-28.png","targets/case-29":"targets/case-29.png","targets/case-30":"targets/case-30.png"},"badgeColors":{"Red":"#D9342B","Green":"#2E8B57","Gold":"#F2B134"},"guide":[{"title":"Welcome","html":"<h1>The North Pole Incident Files<\/h1><h2>Player&#x27;s guide<\/h2><p>Something is wrong on the workshop floor. A USB stick appears out of nowhere, a door is held open for a stranger, the label maker gets an update nobody ordered, and in the end the Naughty-Nice List itself is held to ransom. On top of that, somebody has changed the password of the sleigh vault. Santa has asked you to investigate.<\/p><p>This booklet contains 30 cases. Each case is a logic puzzle: you work out where everybody was standing, and the positions tell you who caused the incident. There is no guessing and no trivia. Every case has exactly one solution, and everything you need is on the page.<\/p><p>The cases come in five levels of six cases each. Each level adds one new idea, and inside a level the cases run from easier to harder:<\/p><table><tr><th>Level<\/th><th>Cases<\/th><th>Grid<\/th><th>People<\/th><th>The new idea<\/th><\/tr><tr><td>1 Recruit<\/td><td>01-06<\/td><td>5x5<\/td><td>4<\/td><td>Place one person at a time. Somebody always has only one square left.<\/td><\/tr><tr><td>2 Responder<\/td><td>07-12<\/td><td>5x5<\/td><td>4<\/td><td>Fewer clues. Ask who can stand in a row or column.<\/td><\/tr><tr><td>3 Analyst<\/td><td>13-18<\/td><td>6x6<\/td><td>5<\/td><td>Clues that compare two figures. Combine them.<\/td><\/tr><tr><td>4 Investigator<\/td><td>19-24<\/td><td>7x7<\/td><td>6<\/td><td>Access badges, cameras, door logs.<\/td><\/tr><tr><td>5 Incident Commander<\/td><td>25-30<\/td><td>6x6, two grids<\/td><td>5<\/td><td>Two moments in time, and statements that may be lies.<\/td><\/tr><\/table><p>Every solved case gives you one character of the vault password. You need all thirty. See chapter 11.<\/p><p><b>How to use this guide.<\/b> Read chapters 1 to 5 once; they apply to every case. Then read chapter 6 and solve level 1. Before you start each new level, read its chapter (7, 8, 9, 10). The case booklet repeats the short version at the start of every level, together with the next part of the story.<\/p>"},{"title":"1. The setting","html":"<h2>1. The setting<\/h2><p>All 30 cases happen on one floor of Santa&#x27;s workshop headquarters. The floor has twelve rooms:<\/p><p>Lobby, Workshop, Wrapping Room, Mail Room, Server Room, Santa&#x27;s Office, Security Office, Break Room, Meeting Room, Print Room, Archive, Storage Room.<\/p><p>Each case shows one section of the floor with four to six of these rooms. The elves rebuild their floor plan more often than is reasonable, so the walls are in a different place in every case. Always use the map of the case in front of you.<\/p><p>The furniture stays where it belongs. Workbenches stand in the Workshop, server racks in the Server Room, printers in the Print Room. A few things turn up everywhere: Christmas trees, rugs, chairs and beanbags.<\/p><p>The suspects are Santa, Jack Frost and eighteen elves. Each case involves Santa, Jack Frost and two to four of the elves.<\/p>"},{"title":"2. What is on a case sheet","html":"<h2>2. What is on a case sheet<\/h2><p><b>Title and story.<\/b> A short account of what went wrong. The story sets the scene; it never contains a clue you need.<\/p><p><b>Target.<\/b> The thing that was attacked, taken, misused or left unprotected: a laptop, a key, a terminal. The target has a position on the map, but no clue ever says where it is. You find the people first. The target is on the square that is left over, and only then do you know who did it.<\/p><p><b>Map.<\/b> A square grid seen from above, north at the top. Columns are lettered from west to east (A, B, C, ...), rows are numbered from north to south (1, 2, 3, ...). A square is named by column and row: <code>C4<\/code> is column C, row 4.<\/p><p><b>Rooms.<\/b> Lines on the map are walls. Squares with no line between them belong to the same room. Rooms can have any shape. Every room has its own floor pattern, and the legend below the map names the rooms, so you never have to guess where a wall runs.<\/p><p><b>Objects.<\/b> The furniture. The legend below the map names every object and says whether its square is blocked.<\/p><p><b>People.<\/b> The suspects in this case, with a two-letter code for your notes.<\/p><p><b>Clues.<\/b> Numbered statements of fact. In levels 1 to 4 every clue is true. Level 5 splits them into statements (some false) and evidence (always true).<\/p><p><b>Code grid.<\/b> A grid of characters, the same size as the map. See chapter 11.<\/p><h3>Map symbols<\/h3><table class=\"symtab\"><tr><th>Symbol<\/th><th>Meaning<\/th><\/tr><tr><td><svg class=\"sym\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#FFF4E0\"/><rect width=\"100\" height=\"100\" fill=\"none\" stroke=\"#2B2B3A\" stroke-opacity=\".4\" stroke-width=\"3\" stroke-dasharray=\"8 8\"/><\/svg><\/td><td>Empty square. A figure can stand here. The floor pattern shows which room the square belongs to.<\/td><\/tr><tr><td><svg class=\"sym\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#2B2B3A\" fill-opacity=\".1\"/><rect x=\"12\" y=\"12\" width=\"76\" height=\"76\" rx=\"14\" fill=\"#2B2B3A\" fill-opacity=\".88\"/><\/svg><\/td><td>Blocked square. A big object (tree, desk, server rack ...) fills the square and the square is shaded. Nobody can stand here.<\/td><\/tr><tr><td><svg class=\"sym\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#FFF4E0\"/><rect x=\"18\" y=\"40\" width=\"64\" height=\"50\" rx=\"12\" fill=\"#fff\" stroke=\"#2B2B3A\" stroke-opacity=\".55\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><\/svg><\/td><td>Small, pale object (rug, chair, beanbag, stool). A figure can stand on this square.<\/td><\/tr><tr><td><svg class=\"sym\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#2B2B3A\" fill-opacity=\".1\"/><circle cx=\"50\" cy=\"44\" r=\"34\" fill=\"#2B2B3A\"/><circle cx=\"50\" cy=\"44\" r=\"15\" fill=\"#7EC8E3\"/><\/svg><\/td><td>A camera with its number (level 4). Also a blocked square.<\/td><\/tr><tr><td><svg class=\"sym\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#FFF4E0\"/><path d=\"M50,0 V100\" stroke=\"#2B2B3A\" stroke-width=\"12\"/><\/svg><\/td><td>Thick line: a wall. The two squares are in different rooms. Dotted lines only separate squares of the same room.<\/td><\/tr><\/table><h3>The objects<\/h3><table><tr><th>On the map<\/th><th>Object<\/th><th>Kind<\/th><th>Found in<\/th><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/christmas-tree.png\" alt=\"\"><\/td><td>Christmas tree<\/td><td>blocked<\/td><td>any room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/fireplace.png\" alt=\"\"><\/td><td>fireplace<\/td><td>blocked<\/td><td>Santa&#x27;s Office, Break Room, Lobby, Meeting Room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/workbench.png\" alt=\"\"><\/td><td>workbench<\/td><td>blocked<\/td><td>Workshop<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/wrapping-table.png\" alt=\"\"><\/td><td>wrapping table<\/td><td>blocked<\/td><td>Wrapping Room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/gift-pile.png\" alt=\"\"><\/td><td>gift pile<\/td><td>blocked<\/td><td>Workshop, Wrapping Room, Storage Room, Mail Room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/server-rack.png\" alt=\"\"><\/td><td>server rack<\/td><td>blocked<\/td><td>Server Room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/printer.png\" alt=\"\"><\/td><td>printer<\/td><td>blocked<\/td><td>Print Room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/filing-cabinet.png\" alt=\"\"><\/td><td>filing cabinet<\/td><td>blocked<\/td><td>Archive, Santa&#x27;s Office, Security Office, Mail Room, Print Room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/desk.png\" alt=\"\"><\/td><td>desk<\/td><td>blocked<\/td><td>Santa&#x27;s Office, Security Office, Lobby, Meeting Room, Server Room, Archive<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/cocoa-machine.png\" alt=\"\"><\/td><td>cocoa machine<\/td><td>blocked<\/td><td>Break Room, Lobby, Meeting Room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/parcel-shelf.png\" alt=\"\"><\/td><td>parcel shelf<\/td><td>blocked<\/td><td>Mail Room, Storage Room, Archive<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/rug.png\" alt=\"\"><\/td><td>rug<\/td><td>walkable<\/td><td>any room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/chair.png\" alt=\"\"><\/td><td>chair<\/td><td>walkable<\/td><td>any room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/beanbag.png\" alt=\"\"><\/td><td>beanbag<\/td><td>walkable<\/td><td>any room<\/td><\/tr><tr><td><img class=\"lgbild gr\" src=\"assets/objects/stool.png\" alt=\"\"><\/td><td>stool<\/td><td>walkable<\/td><td>Workshop, Wrapping Room, Break Room, Server Room, Storage Room<\/td><\/tr><\/table><p>You do not need this table to solve a case, because every case has its own legend below the map.<\/p>"},{"title":"3. The basic rules","html":"<h2>3. The basic rules<\/h2><p>These five rules apply to every case.<\/p><ol><li><b>One figure per row and per column.<\/b> Every row contains exactly one figure, and so does every column. The figures are all the people <i>and<\/i> the target. A 5x5 case has four people and one target, so every row and column is used exactly once.<\/li><li><b>Blocked squares stay empty.<\/b> Nobody stands on a shaded square with a big object. The small, pale objects (rug, chair, beanbag, stool) can be stood on. The legend below the map lists both groups.<\/li><li><b>&quot;Right next to&quot; means touching, in the same room.<\/b> A figure is right next to an object when the two squares share an edge (not just a corner) and belong to the same room.<\/li><li><b>North is up.<\/b> &quot;Further north&quot; means in a row closer to the top. The column does not matter. The same holds for south, west and east. The four edges of the map are the outer walls of the floor.<\/li><li><b>The culprit is the only person in the target&#x27;s room.<\/b> When all figures are placed, exactly one person shares a room with the target. That person caused the incident.<\/li><\/ol><p>Two figures can share a room. They can never share a row or a column.<\/p>"},{"title":"4. Santa and Jack Frost","html":"<h2>4. Santa and Jack Frost<\/h2><p>Two people are in every case, and both are special.<\/p><p><b>Santa<\/b> is beyond suspicion. He is never the culprit, in any case, and in level 5 he always tells the truth.<\/p><p><b>Jack Frost<\/b> is the opposite. He is a suspect in every case, sometimes he is the culprit and sometimes he is not, and in level 5 he lies every single time he opens his mouth, guilty or not.<\/p><p>Everybody else is an elf who may have made an honest mistake.<\/p>"},{"title":"5. What the clues mean","html":"<h2>5. What the clues mean<\/h2><p>Every clue has one exact meaning. If you are unsure how to read a clue, this table decides. Levels 3 to 5 add a few clue types of their own; those are explained in their chapters.<\/p><table><tr><th>Clue<\/th><th>Exact meaning<\/th><\/tr><tr><td>X was in the Break Room.<\/td><td>X stands on a square of that room.<\/td><\/tr><tr><td>X was not in the Break Room.<\/td><td>X stands on a square of any other room. (From level 2.)<\/td><\/tr><tr><td>X was by the north outer wall.<\/td><td>X stands on a square at the top edge of the map. South is the bottom edge, west the left edge, east the right edge. Walls between rooms are not outer walls.<\/td><\/tr><tr><td>X was in the north half of the floor.<\/td><td>X stands in the upper half of the map. On a map with an odd number of rows the middle row belongs to neither half. West and east halves work the same way with columns.<\/td><\/tr><tr><td>X was on a rug.<\/td><td>X stands on a square that holds this walkable object.<\/td><\/tr><tr><td>X was right next to a fireplace.<\/td><td>X stands on a square that shares an edge with a fireplace square in the same room. Diagonal does not count. A wall in between does not count.<\/td><\/tr><tr><td>X was in a room with a printer.<\/td><td>The room X stands in contains at least one printer, anywhere in the room.<\/td><\/tr><\/table><p>&quot;A&quot; always means &quot;at least one&quot;: a figure next to two stools is right next to a stool.<\/p><p>Two clues about the same person both have to hold. Only the squares that satisfy both remain.<\/p><p>The target never gets a clue of its own about where it is.<\/p>"},{"title":"6. Level 1, Recruit: one person at a time","html":"<h2 class=\"neu\">6. Level 1, Recruit: one person at a time<\/h2><p><b>What is special:<\/b> every clue is about one person, and at every moment at least one person has exactly one possible square.<\/p><h3>Method<\/h3><ol><li><b>Write down candidates.<\/b> For each person, note the squares the clues allow. Start with the clues that name a room, an outer wall or an object, because they cut the list down fastest.<\/li><li><b>Place whoever has one square left.<\/b> There is always such a person. Start there.<\/li><li><b>Strike out the row and the column.<\/b> As soon as a figure is placed, its whole row and its whole column are closed to everybody else. Cross those squares off the other lists. Somebody else is now down to one square.<\/li><li><b>Repeat<\/b> until all the people are placed.<\/li><li><b>Place the target.<\/b> One row and one column are still empty. The target is on the square where they cross.<\/li><li><b>Read off the culprit.<\/b> Find the target&#x27;s room. The one person standing in that room did it.<\/li><\/ol><p>The culprit only becomes clear at the end, when the target has a square. Do not try to guess early. The story and the names are there to mislead you.<\/p><h3>Worked example: Case 00, Orientation Day<\/h3><p><i>Every new elf gets a welcome badge on the first day. Today one badge left its hook before its owner arrived. Nobody saw anything, which on a floor with this many windows is quite an achievement.<\/i><\/p><p>Target: the welcome badge<\/p><div class=\"beispiel\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 566 566\" class=\"karte karte-voll\" font-family=\"Inter, 'DejaVu Sans', Arial, sans-serif\"><defs><pattern id=\"ex1-fl-santas-office\" patternUnits=\"userSpaceOnUse\" x=\"56\" y=\"56\" width=\"100\" height=\"100\"><image href=\"assets/floors/santas-office.png\" x=\"0\" y=\"0\" width=\"100\" height=\"100\" preserveAspectRatio=\"none\"/><\/pattern><pattern id=\"ex1-fl-mail-room\" patternUnits=\"userSpaceOnUse\" x=\"56\" y=\"56\" width=\"100\" height=\"100\"><image href=\"assets/floors/mail-room.png\" x=\"0\" y=\"0\" width=\"100\" height=\"100\" preserveAspectRatio=\"none\"/><\/pattern><pattern id=\"ex1-fl-server-room\" patternUnits=\"userSpaceOnUse\" x=\"56\" y=\"56\" width=\"100\" height=\"100\"><image href=\"assets/floors/server-room.png\" x=\"0\" y=\"0\" width=\"100\" height=\"100\" preserveAspectRatio=\"none\"/><\/pattern><pattern id=\"ex1-fl-wrapping-room\" patternUnits=\"userSpaceOnUse\" x=\"56\" y=\"56\" width=\"100\" height=\"100\"><image href=\"assets/floors/wrapping-room.png\" x=\"0\" y=\"0\" width=\"100\" height=\"100\" preserveAspectRatio=\"none\"/><\/pattern><\/defs><g id=\"ex1-floors\"><rect x=\"56\" y=\"56\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-mail-room)\"/><rect x=\"56\" y=\"156\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-mail-room)\"/><rect x=\"56\" y=\"256\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-mail-room)\"/><rect x=\"56\" y=\"356\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-santas-office)\"/><rect x=\"56\" y=\"456\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-santas-office)\"/><rect x=\"156\" y=\"56\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-mail-room)\"/><rect x=\"156\" y=\"156\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-mail-room)\"/><rect x=\"156\" y=\"256\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-mail-room)\"/><rect x=\"156\" y=\"356\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-santas-office)\"/><rect x=\"156\" y=\"456\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-santas-office)\"/><rect x=\"256\" y=\"56\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-mail-room)\"/><rect x=\"256\" y=\"156\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-mail-room)\"/><rect x=\"256\" y=\"256\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-santas-office)\"/><rect x=\"256\" y=\"356\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-santas-office)\"/><rect x=\"256\" y=\"456\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-server-room)\"/><rect x=\"356\" y=\"56\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-wrapping-room)\"/><rect x=\"356\" y=\"156\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-mail-room)\"/><rect x=\"356\" y=\"256\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-wrapping-room)\"/><rect x=\"356\" y=\"356\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-server-room)\"/><rect x=\"356\" y=\"456\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-server-room)\"/><rect x=\"456\" y=\"56\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-wrapping-room)\"/><rect x=\"456\" y=\"156\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-wrapping-room)\"/><rect x=\"456\" y=\"256\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-wrapping-room)\"/><rect x=\"456\" y=\"356\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-wrapping-room)\"/><rect x=\"456\" y=\"456\" width=\"100\" height=\"100\" fill=\"url(#ex1-fl-server-room)\"/><\/g><g id=\"ex1-grid\"><path d=\"M156,56 V156 M56,156 H156 M156,156 V256 M56,256 H156 M156,256 V356 M156,356 V456 M56,456 H156 M156,456 V556 M256,56 V156 M156,156 H256 M256,156 V256 M156,256 H256 M256,356 V456 M156,456 H256 M256,156 H356 M356,156 V256 M256,356 H356 M356,456 V556 M456,56 V156 M456,256 V356 M356,456 H456 M456,456 V556 M456,156 H556 M456,256 H556 M456,356 H556\" fill=\"none\" stroke=\"#2B2B3A\" stroke-opacity=\".38\" stroke-width=\"1.6\" stroke-dasharray=\"5 5\"/><\/g><g id=\"ex1-objects\"><image href=\"assets/objects/chair.png\" x=\"71\" y=\"478\" width=\"70\" height=\"70\" opacity=\".6\"/><rect x=\"156\" y=\"56\" width=\"100\" height=\"100\" fill=\"#2B2B3A\" fill-opacity=\".10\"/><image href=\"assets/objects/parcel-shelf.png\" x=\"162\" y=\"62\" width=\"88\" height=\"88\"/><image href=\"assets/objects/chair.png\" x=\"271\" y=\"378\" width=\"70\" height=\"70\" opacity=\".6\"/><rect x=\"356\" y=\"56\" width=\"100\" height=\"100\" fill=\"#2B2B3A\" fill-opacity=\".10\"/><image href=\"assets/objects/wrapping-table.png\" x=\"362\" y=\"62\" width=\"88\" height=\"88\"/><image href=\"assets/objects/chair.png\" x=\"371\" y=\"178\" width=\"70\" height=\"70\" opacity=\".6\"/><image href=\"assets/objects/stool.png\" x=\"371\" y=\"478\" width=\"70\" height=\"70\" opacity=\".6\"/><image href=\"assets/objects/stool.png\" x=\"471\" y=\"78\" width=\"70\" height=\"70\" opacity=\".6\"/><rect x=\"456\" y=\"156\" width=\"100\" height=\"100\" fill=\"#2B2B3A\" fill-opacity=\".10\"/><image href=\"assets/objects/gift-pile.png\" x=\"462\" y=\"162\" width=\"88\" height=\"88\"/><image href=\"assets/objects/stool.png\" x=\"471\" y=\"278\" width=\"70\" height=\"70\" opacity=\".6\"/><\/g><g id=\"ex1-walls\"><path d=\"M56,356 H156 M256,256 V356 M156,356 H256 M256,456 V556 M356,56 V156 M256,256 H356 M356,256 V356 M356,356 V456 M256,456 H356 M356,156 H456 M456,156 V256 M356,256 H456 M356,356 H456 M456,356 V456 M456,456 H556\" fill=\"none\" stroke=\"#2B2B3A\" stroke-width=\"9\" stroke-linecap=\"round\"/><rect x=\"56\" y=\"56\" width=\"500\" height=\"500\" fill=\"none\" stroke=\"#2B2B3A\" stroke-width=\"13\" stroke-linejoin=\"round\"/><\/g><g id=\"ex1-room-names\"><text x=\"264\" y=\"272\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2B3A\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-opacity=\".85\" paint-order=\"stroke\" stroke-linejoin=\"round\">Santa&#x27;s Office<\/text><text x=\"64\" y=\"72\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2B3A\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-opacity=\".85\" paint-order=\"stroke\" stroke-linejoin=\"round\">Mail Room<\/text><text x=\"364\" y=\"372\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2B3A\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-opacity=\".85\" paint-order=\"stroke\" stroke-linejoin=\"round\">Server Room<\/text><text x=\"364\" y=\"272\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2B3A\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-opacity=\".85\" paint-order=\"stroke\" stroke-linejoin=\"round\">Wrapping Room<\/text><\/g><g id=\"ex1-labels\"><text x=\"106\" y=\"40\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">A<\/text><text x=\"24\" y=\"117\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">1<\/text><text x=\"206\" y=\"40\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">B<\/text><text x=\"24\" y=\"217\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">2<\/text><text x=\"306\" y=\"40\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">C<\/text><text x=\"24\" y=\"317\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">3<\/text><text x=\"406\" y=\"40\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">D<\/text><text x=\"24\" y=\"417\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">4<\/text><text x=\"506\" y=\"40\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">E<\/text><text x=\"24\" y=\"517\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">5<\/text><\/g><\/svg><div class=\"btext\"><h4>People<\/h4><ul><li><b>JF<\/b> Jack Frost<\/li><li><b>WC<\/b> Wombley Cube<\/li><li><b>SA<\/b> Santa<\/li><li><b>GB<\/b> Ginger Breddie<\/li><\/ul><h4>Clues<\/h4><ol><li>Jack Frost was right next to a chair.<\/li><li>Jack Frost was by the south outer wall.<\/li><li>Wombley Cube was right next to a parcel shelf.<\/li><li>Wombley Cube was by the west outer wall.<\/li><li>Santa was in a room with a wrapping table.<\/li><li>Ginger Breddie was right next to a stool.<\/li><li>Ginger Breddie was by the east outer wall.<\/li><\/ol><\/div><\/div><p><b>Step 1: candidates from the clues.<\/b><\/p><ul><li>Jack is by the south outer wall, so in row 5, and right next to a chair. Go along row 5. A5 <i>is<\/i> a chair, but has no chair beside it. B5 touches the chair on A5 in the same room. C5 touches the chair on C4, but there is a wall in between. D5 and E5 touch no chair. <b>Jack is on B5.<\/b><\/li><li>Wombley is by the west outer wall, so in column A, and right next to a parcel shelf. The only parcel shelf is on B1, and the only square of column A that touches it is A1. <b>Wombley is on A1.<\/b><\/li><li>Santa is in a room with a wrapping table. That is the Wrapping Room. Its free squares are E1, D3, E3 and E4.<\/li><li>Ginger is by the east outer wall, so in column E, and right next to a stool. E4 touches the stool on E3, and E5 touches the stool on D5; both pairs are in the same room. E1 and E3 are stools themselves and have no stool beside them. Ginger is on E4 or E5.<\/li><\/ul><p>Two people are placed already, straight from their clues.<\/p><p><b>Step 2: strike out rows and columns.<\/b> Jack on B5 closes row 5 and column B. Wombley on A1 closes row 1 and column A.<\/p><ul><li>Ginger was on E4 or E5. Row 5 is closed. <b>Ginger is on E4.<\/b> That closes row 4 and column E.<\/li><li>Santa was on E1, D3, E3 or E4. Row 1 is closed, and so is column E. <b>Santa is on D3.<\/b> That closes row 3 and column D.<\/li><\/ul><p><b>Step 3: the target.<\/b> All four people are placed. Row 2 and column C are still empty. <b>The badge is on C2.<\/b><\/p><p><b>Step 4: the culprit.<\/b> C2 is in the Mail Room. Who is in the Mail Room? Jack (B5) is in Santa&#x27;s Office, Santa (D3) and Ginger (E4) are in the Wrapping Room. Only Wombley (A1) is in the Mail Room. <b>Wombley Cube is the culprit.<\/b><\/p><p>Notice two things. Jack Frost looked suspicious and was innocent. And nothing pointed at Wombley until the very last step, when the badge finally had a square.<\/p>"},{"title":"7. Level 2, Responder: ask the rows and columns","html":"<h2 class=\"neu\">7. Level 2, Responder: ask the rows and columns<\/h2><p><b>What is special:<\/b> there are fewer clues. Some people have only a vague clue, some have none at all, and you will reach a point where nobody is down to one square. The level 1 method stalls there. The way forward is to turn the question around.<\/p><p><b>New clue type:<\/b> &quot;X was not in the Break Room.&quot;<\/p><h3>The new technique<\/h3><p>In level 1 you asked: <i>where can this person stand?<\/i> Now you also ask: <i><b>who can stand in this row?<\/b><\/i> Every row needs exactly one figure, and so does every column. Go through the rows and columns that are still open:<\/p><ul><li><b>Only one person can still reach this row.<\/b> Then that person is in this row, however many other squares it seemed to have. Cross off its squares in all other rows.<\/li><li><b>No person can reach this row.<\/b> Then the target is in this row. The target has no clue, so it can go anywhere, and it is the only figure left to fill the gap. This happens in almost every level 2 case and is usually the way in.<\/li><\/ul><p>After each such step, go back to the level 1 routine: somebody may now be down to one square.<\/p><p>People without any clue are placed like the target: by what is left over.<\/p><h3>Worked example: Case 00b, The Cookie Jar<\/h3><p>Target: the cookie jar<\/p><div class=\"beispiel\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 566 566\" class=\"karte karte-voll\" font-family=\"Inter, 'DejaVu Sans', Arial, sans-serif\"><defs><pattern id=\"ex2-fl-print-room\" patternUnits=\"userSpaceOnUse\" x=\"56\" y=\"56\" width=\"100\" height=\"100\"><image href=\"assets/floors/print-room.png\" x=\"0\" y=\"0\" width=\"100\" height=\"100\" preserveAspectRatio=\"none\"/><\/pattern><pattern id=\"ex2-fl-workshop\" patternUnits=\"userSpaceOnUse\" x=\"56\" y=\"56\" width=\"100\" height=\"100\"><image href=\"assets/floors/workshop.png\" x=\"0\" y=\"0\" width=\"100\" height=\"100\" preserveAspectRatio=\"none\"/><\/pattern><pattern id=\"ex2-fl-santas-office\" patternUnits=\"userSpaceOnUse\" x=\"56\" y=\"56\" width=\"100\" height=\"100\"><image href=\"assets/floors/santas-office.png\" x=\"0\" y=\"0\" width=\"100\" height=\"100\" preserveAspectRatio=\"none\"/><\/pattern><pattern id=\"ex2-fl-break-room\" patternUnits=\"userSpaceOnUse\" x=\"56\" y=\"56\" width=\"100\" height=\"100\"><image href=\"assets/floors/break-room.png\" x=\"0\" y=\"0\" width=\"100\" height=\"100\" preserveAspectRatio=\"none\"/><\/pattern><\/defs><g id=\"ex2-floors\"><rect x=\"56\" y=\"56\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-workshop)\"/><rect x=\"56\" y=\"156\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-workshop)\"/><rect x=\"56\" y=\"256\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-workshop)\"/><rect x=\"56\" y=\"356\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-workshop)\"/><rect x=\"56\" y=\"456\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-workshop)\"/><rect x=\"156\" y=\"56\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-break-room)\"/><rect x=\"156\" y=\"156\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-break-room)\"/><rect x=\"156\" y=\"256\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-workshop)\"/><rect x=\"156\" y=\"356\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-workshop)\"/><rect x=\"156\" y=\"456\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-santas-office)\"/><rect x=\"256\" y=\"56\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-break-room)\"/><rect x=\"256\" y=\"156\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-break-room)\"/><rect x=\"256\" y=\"256\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-break-room)\"/><rect x=\"256\" y=\"356\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-santas-office)\"/><rect x=\"256\" y=\"456\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-santas-office)\"/><rect x=\"356\" y=\"56\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-break-room)\"/><rect x=\"356\" y=\"156\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-break-room)\"/><rect x=\"356\" y=\"256\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-print-room)\"/><rect x=\"356\" y=\"356\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-santas-office)\"/><rect x=\"356\" y=\"456\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-santas-office)\"/><rect x=\"456\" y=\"56\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-print-room)\"/><rect x=\"456\" y=\"156\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-print-room)\"/><rect x=\"456\" y=\"256\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-print-room)\"/><rect x=\"456\" y=\"356\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-print-room)\"/><rect x=\"456\" y=\"456\" width=\"100\" height=\"100\" fill=\"url(#ex2-fl-print-room)\"/><\/g><g id=\"ex2-grid\"><path d=\"M56,156 H156 M56,256 H156 M156,256 V356 M56,356 H156 M156,356 V456 M56,456 H156 M256,56 V156 M156,156 H256 M256,156 V256 M156,356 H256 M256,456 V556 M356,56 V156 M256,156 H356 M356,156 V256 M256,256 H356 M356,356 V456 M256,456 H356 M356,456 V556 M356,156 H456 M456,256 V356 M356,456 H456 M456,156 H556 M456,256 H556 M456,356 H556 M456,456 H556\" fill=\"none\" stroke=\"#2B2B3A\" stroke-opacity=\".38\" stroke-width=\"1.6\" stroke-dasharray=\"5 5\"/><\/g><g id=\"ex2-objects\"><image href=\"assets/objects/chair.png\" x=\"71\" y=\"178\" width=\"70\" height=\"70\" opacity=\".6\"/><image href=\"assets/objects/chair.png\" x=\"71\" y=\"378\" width=\"70\" height=\"70\" opacity=\".6\"/><image href=\"assets/objects/beanbag.png\" x=\"171\" y=\"278\" width=\"70\" height=\"70\" opacity=\".6\"/><rect x=\"156\" y=\"456\" width=\"100\" height=\"100\" fill=\"#2B2B3A\" fill-opacity=\".10\"/><image href=\"assets/objects/desk.png\" x=\"162\" y=\"462\" width=\"88\" height=\"88\"/><image href=\"assets/objects/beanbag.png\" x=\"271\" y=\"478\" width=\"70\" height=\"70\" opacity=\".6\"/><rect x=\"356\" y=\"56\" width=\"100\" height=\"100\" fill=\"#2B2B3A\" fill-opacity=\".10\"/><image href=\"assets/objects/cocoa-machine.png\" x=\"362\" y=\"62\" width=\"88\" height=\"88\"/><image href=\"assets/objects/beanbag.png\" x=\"371\" y=\"278\" width=\"70\" height=\"70\" opacity=\".6\"/><image href=\"assets/objects/chair.png\" x=\"371\" y=\"378\" width=\"70\" height=\"70\" opacity=\".6\"/><rect x=\"456\" y=\"156\" width=\"100\" height=\"100\" fill=\"#2B2B3A\" fill-opacity=\".10\"/><image href=\"assets/objects/printer.png\" x=\"462\" y=\"162\" width=\"88\" height=\"88\"/><rect x=\"456\" y=\"356\" width=\"100\" height=\"100\" fill=\"#2B2B3A\" fill-opacity=\".10\"/><image href=\"assets/objects/printer.png\" x=\"462\" y=\"362\" width=\"88\" height=\"88\"/><\/g><g id=\"ex2-walls\"><path d=\"M156,56 V156 M156,156 V256 M156,456 V556 M156,256 H256 M256,256 V356 M256,356 V456 M156,456 H256 M356,256 V356 M256,356 H356 M456,56 V156 M456,156 V256 M356,256 H456 M356,356 H456 M456,356 V456 M456,456 V556\" fill=\"none\" stroke=\"#2B2B3A\" stroke-width=\"9\" stroke-linecap=\"round\"/><rect x=\"56\" y=\"56\" width=\"500\" height=\"500\" fill=\"none\" stroke=\"#2B2B3A\" stroke-width=\"13\" stroke-linejoin=\"round\"/><\/g><g id=\"ex2-room-names\"><text x=\"464\" y=\"72\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2B3A\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-opacity=\".85\" paint-order=\"stroke\" stroke-linejoin=\"round\">Print Room<\/text><text x=\"64\" y=\"72\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2B3A\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-opacity=\".85\" paint-order=\"stroke\" stroke-linejoin=\"round\">Workshop<\/text><text x=\"264\" y=\"372\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2B3A\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-opacity=\".85\" paint-order=\"stroke\" stroke-linejoin=\"round\">Santa&#x27;s Office<\/text><text x=\"164\" y=\"72\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2B3A\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-opacity=\".85\" paint-order=\"stroke\" stroke-linejoin=\"round\">Break Room<\/text><\/g><g id=\"ex2-labels\"><text x=\"106\" y=\"40\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">A<\/text><text x=\"24\" y=\"117\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">1<\/text><text x=\"206\" y=\"40\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">B<\/text><text x=\"24\" y=\"217\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">2<\/text><text x=\"306\" y=\"40\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">C<\/text><text x=\"24\" y=\"317\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">3<\/text><text x=\"406\" y=\"40\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">D<\/text><text x=\"24\" y=\"417\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">4<\/text><text x=\"506\" y=\"40\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">E<\/text><text x=\"24\" y=\"517\" font-size=\"30\" font-weight=\"800\" fill=\"#2B2B3A\" text-anchor=\"middle\">5<\/text><\/g><\/svg><div class=\"btext\"><h4>People<\/h4><ul><li><b>ES<\/b> Eve Snowshoes<\/li><li><b>AC<\/b> Angel Candysalt<\/li><li><b>JF<\/b> Jack Frost<\/li><li><b>SA<\/b> Santa<\/li><\/ul><h4>Clues<\/h4><ol><li>Eve Snowshoes was in the north half of the floor.<\/li><li>Eve Snowshoes was not in the Break Room.<\/li><li>Angel Candysalt was on a chair.<\/li><li>Jack Frost was by the north outer wall.<\/li><li>Santa was right next to a beanbag.<\/li><li>Santa was by the east outer wall.<\/li><\/ol><\/div><\/div><p><b>Step 1: candidates from the clues.<\/b><\/p><ul><li>Eve is in the north half. With five rows, that is rows 1 and 2; the middle row belongs to neither half. She is not in the Break Room, which removes B1, C1, B2, C2 and D2. D1 and E2 are blocked. Eve is on A1, E1 or A2.<\/li><li>Angel is on a chair: A2, A4 or D4.<\/li><li>Jack is by the north outer wall: A1, B1, C1 or E1.<\/li><li>Santa is by the east outer wall, so in column E, and right next to a beanbag. Only E3 touches a beanbag (the one on D3, same room). <b>Santa is on E3.<\/b><\/li><\/ul><p><b>Step 2: the level 1 routine.<\/b> Santa closes row 3 and column E. Eve is down to A1 or A2, Jack to A1, B1 or C1. Angel still has A2, A4 or D4. Nobody has one square left. In level 1 this could not happen. Now it is the signal to change the question.<\/p><p><b>Step 3: ask the rows.<\/b><\/p><ul><li><i>Who can stand in row 5?<\/i> Eve is in rows 1 or 2, Angel in rows 2 or 4, Jack in row 1, Santa in row 3. No person can. <b>The target is in row 5.<\/b><\/li><li><i>Who can stand in row 4?<\/i> The target is in row 5 now. Eve and Jack cannot. Only Angel can. <b>Angel is in row 4<\/b>, on A4 or D4. She is no longer a candidate for A2.<\/li><li><i>Who can stand in row 2?<\/i> Angel has just left it. Jack is in row 1. Only Eve can. <b>Eve is on A2.<\/b><\/li><\/ul><p><b>Step 4: back to the routine.<\/b> Eve closes row 2 and column A.<\/p><ul><li>Angel was on A4 or D4. Column A is closed. <b>Angel is on D4.<\/b> That closes row 4 and column D.<\/li><li>The target is in row 5. A5 is in column A, D5 in column D, E5 in column E, and B5 is blocked. <b>The cookie jar is on C5.<\/b> That closes column C.<\/li><li>Jack was on A1, B1 or C1. Columns A and C are closed. <b>Jack is on B1.<\/b><\/li><\/ul><p><b>Step 5: the culprit.<\/b> C5 is in Santa&#x27;s Office. Eve (A2) is in the Workshop, Jack (B1) in the Break Room, Santa (E3) in the Print Room. Only Angel (D4) is in Santa&#x27;s Office. <b>Angel Candysalt is the culprit.<\/b><\/p><p>The whole case turned on row 5. No clue mentioned it. It mattered because nobody could stand in it.<\/p>"},{"title":"8. Level 3, Analyst: comparing clues","html":"<h2 class=\"neu\">8. Level 3, Analyst: comparing clues<\/h2><p><b>What is special:<\/b> the map is 6x6 with five people, and most clues no longer say where somebody was. They compare two figures. One comparison alone rarely places anybody. Two or three together do.<\/p><h3>New clue types<\/h3><table><tr><th>Clue<\/th><th>Exact meaning<\/th><\/tr><tr><td>X was in the same room as Y.<\/td><td>X and Y stand in one room.<\/td><\/tr><tr><td>X was not in the same room as Y.<\/td><td>X and Y stand in different rooms.<\/td><\/tr><tr><td>X was further north than Y.<\/td><td>X&#x27;s row is above Y&#x27;s row. Columns do not matter. (South, west and east work the same way.)<\/td><\/tr><tr><td>X was the only person in the room.<\/td><td>No other person stands in X&#x27;s room. The target is not a person, so the target may be there.<\/td><\/tr><\/table><p>The target can now appear in a comparison (&quot;X was further west than the master key&quot;, &quot;The master key was further north than X&quot;). It is never mentioned in a &quot;same room&quot; clue, because that would give the answer away.<\/p><h3>How to work with comparisons<\/h3><ul><li><b>Turn every direction clue into limits at once.<\/b> &quot;X was further north than Y&quot; means X is not in the bottom row and Y is not in the top row. Write that down before you do anything else. Three or four such limits usually pin somebody to one or two rows.<\/li><li><b>Chain them.<\/b> &quot;X further north than Y&quot; and &quot;Y further north than Z&quot; puts X at least two rows above Z. On a six-row map that leaves X four rows and Z four rows, and they shrink quickly.<\/li><li><b>Three in a fixed order.<\/b> If X is further north than Y and Y is further north than Z, the three stand in three different rows in exactly that order. When only three rows are still possible for them, each one is settled at once. The same goes for west and east with columns. Look for such chains first: they often place three figures before any other clue is used.<\/li><li><b>Tighten as you go.<\/b> Once Y is known to be in row 2, &quot;X further north than Y&quot; puts X in row 1. Reread the comparisons every time a figure gets placed or loses candidates.<\/li><li><b>Use &quot;same room&quot; both ways.<\/b> If X and Y share a room and X can only be in the Mail Room or the Archive, Y is limited to those two rooms as well.<\/li><li><b>&quot;The only person in the room&quot; shuts everybody else out.<\/b> Once you know X&#x27;s room, strike it from every other person&#x27;s list.<\/li><li><b>Let the furniture name the room.<\/b> &quot;In a room with a server rack&quot; means the Server Room. &quot;In a room with a cocoa machine&quot; narrows it to the rooms of this case that have one.<\/li><li><b>Pairs.<\/b> If two figures can only be in rows 1 and 2 between them, nobody else is in rows 1 and 2.<\/li><\/ul><p>Everything from levels 1 and 2 still applies. A typical level 3 case goes: limits from the comparisons, one row or column question, then a chain of single squares.<\/p><p>A small example of two clues squeezing one person. Suppose Pepper &quot;was further north than Santa&quot; and &quot;was further south than Jack Frost&quot;, and you already know Jack is in row 2 and Santa in row 4. Then Pepper is in row 3, whatever else the map says.<\/p>"},{"title":"9. Level 4, Investigator: badges, cameras and door logs","html":"<h2 class=\"neu\">9. Level 4, Investigator: badges, cameras and door logs<\/h2><p><b>What is special:<\/b> the map is 7x7 with six people, and the building&#x27;s new security systems supply three new kinds of information. Used in the right order they make a large map small.<\/p><h3>Access badges<\/h3><p>Every person wears a badge: Red, Green or Gold. The <b>access rights<\/b> table lists the rooms each color may enter. A person is never in a room that is not cleared for their badge. The target has no badge and can be in any room.<\/p><p><b>Do this first, in every case:<\/b> strike the forbidden rooms from each person&#x27;s list. It is free information and often removes half the map before you have read a single clue.<\/p><h3>Cameras<\/h3><p>A camera sits on a blocked square. It watches its own row and its own column in all four directions, straight through room borders, until a blocked square interrupts the view. You do not have to work this out: the legend below the map names the watched squares for every camera.<\/p><table><tr><th>Clue<\/th><th>Exact meaning<\/th><\/tr><tr><td>Camera C1 recorded X.<\/td><td>X stands on one of the squares C1 watches.<\/td><\/tr><tr><td>Camera C1 did not record X.<\/td><td>X stands on none of those squares.<\/td><\/tr><tr><td>Camera C1 recorded exactly 2 people.<\/td><td>Exactly two people stand on watched squares. &quot;Nobody&quot; means zero.<\/td><\/tr><\/table><p>Cameras record people only. The target is never counted.<\/p><p>&quot;Recorded X&quot; is a strong clue: combine the watched squares with X&#x27;s badge and there are often only two or three squares left. &quot;Did not record X&quot; removes a whole cross of squares.<\/p><h3>Door logs<\/h3><table><tr><th>Clue<\/th><th>Exact meaning<\/th><\/tr><tr><td>Door log Archive: exactly 2 people in the room.<\/td><td>Exactly two people stand in the Archive.<\/td><\/tr><tr><td>Door log Archive: nobody in the room.<\/td><td>No person stands in the Archive.<\/td><\/tr><\/table><p>Door logs count people only, not the target.<\/p><h3>Counting clues cut both ways<\/h3><p>This is the technique of the level. A count is a ceiling and a floor at the same time.<\/p><ul><li><b>The room is full.<\/b> The log says two people and you already know two who must be there. Everybody else is out of that room.<\/li><li><b>The room needs everyone who can come.<\/b> The log says two people and only two people can still get in (because of badges and earlier steps). Both of them are in.<\/li><li><b>Nobody.<\/b> Strike the room from every person&#x27;s list. The same goes for a camera that recorded nobody: strike all its watched squares.<\/li><\/ul><p>The same reasoning works for camera counts.<\/p><h3>Two people, two rows<\/h3><p>On a 7x7 map with six people you will meet this situation: after badges and cameras, two people can only stand in the same two rows. Say Bow can only be in row 1 or 2, and Angel can only be in row 1 or 2. Whichever way round they stand, rows 1 and 2 are both taken. <b>Nobody else is in rows 1 or 2<\/b>, so strike those rows from every other list, the target&#x27;s included.<\/p><p>It works the same way for columns, and for three people who share three rows. The row question from level 2 (&quot;who can stand here?&quot;) is the special case with one person and one row.<\/p><p>Look for this whenever the lists have stopped shrinking. Typical signs: two people with the same badge color, or two people whose clues both mention the same outer wall or the same half.<\/p><h3>Suggested order<\/h3><ol><li>Badges: strike forbidden rooms.<\/li><li>&quot;Recorded&quot; and &quot;did not record&quot; clues: strike squares.<\/li><li>Logs and camera counts that say &quot;nobody&quot;.<\/li><li>The comparisons, as in level 3.<\/li><li>The remaining counts: is a room full, or does it need everyone who can come?<\/li><li>Row and column questions, as in level 2, and single squares, as in level 1.<\/li><li>Still stuck? Look for two people who share two rows or two columns.<\/li><\/ol>"},{"title":"10. Level 5, Incident Commander: two snapshots and liars","html":"<h2 class=\"neu\">10. Level 5, Incident Commander: two snapshots and liars<\/h2><p><b>What is special:<\/b> you fill in two grids for every case, and you can no longer believe everything you read. The culprit is not found by placing everybody and looking. You find the culprit by showing that everybody else is impossible.<\/p><h3>Two snapshots<\/h3><p>A level 5 case has one map but two moments in time:<\/p><ul><li><b>Incident:<\/b> where everybody was when it happened.<\/li><li><b>Discovery:<\/b> where everybody was when it was noticed.<\/li><\/ul><p>The rules:<\/p><ul><li>The basic rules apply to each grid separately. One figure per row and column at the incident, and again at the discovery.<\/li><li>The target does not move. It is on the same square in both grids.<\/li><li>Between the snapshots every person either <b>stayed in their room<\/b> or <b>moved to a directly adjoining room<\/b>, meaning a room that shares a wall with it. On the map, two rooms adjoin when a wall runs between a square of one and a square of the other. Inside a room a person may change squares freely.<\/li><li>The culprit is the only person in the target&#x27;s room <b>at the time of the incident<\/b>. Where people were at the discovery says nothing about guilt by itself.<\/li><\/ul><p>Clues are tagged <code>[Incident]<\/code> or <code>[Discovery]<\/code>. Two more clue types connect the grids:<\/p><table><tr><th>Clue<\/th><th>Exact meaning<\/th><\/tr><tr><td>X stayed in the same room.<\/td><td>X is in the same room in both grids (possibly on a different square).<\/td><\/tr><tr><td>X moved to a different room.<\/td><td>X is in an adjoining room at the discovery.<\/td><\/tr><\/table><h3>Statements and evidence<\/h3><p>Every person makes exactly one <b>statement<\/b>. Statements can be false:<\/p><ul><li><b>Santa<\/b> always tells the truth.<\/li><li><b>Jack Frost<\/b> always lies, whether he is the culprit or not.<\/li><li><b>Everyone else<\/b> tells the truth, unless they are the culprit. The culprit&#x27;s statement is false.<\/li><\/ul><p><b>Evidence<\/b> is always true. It uses the clue types you know from levels 1 to 3, plus door logs. Badges and cameras do not appear in level 5.<\/p><p>A false statement is false as a whole, which tells you something definite:<\/p><table><tr><th>If this is a lie ...<\/th><th>... then this is true<\/th><\/tr><tr><td>&quot;I was by the east outer wall.&quot;<\/td><td>The speaker was not at the east edge of the map.<\/td><\/tr><tr><td>&quot;I was in the north half of the floor.&quot;<\/td><td>The speaker was in the south half. (Level 5 maps have six rows, so there is no middle row.)<\/td><\/tr><tr><td>&quot;I was not in the Archive.&quot;<\/td><td>The speaker was in the Archive.<\/td><\/tr><tr><td>&quot;I was in the same room as Y.&quot;<\/td><td>The speaker was in a different room.<\/td><\/tr><tr><td>&quot;I was further north than Y.&quot;<\/td><td>The speaker was further south than Y. (Two figures never share a row.)<\/td><\/tr><tr><td>&quot;I stayed in the same room.&quot;<\/td><td>The speaker moved.<\/td><\/tr><\/table><h3>How to attack a level 5 case<\/h3><ol><li><b>Collect the solid facts:<\/b> all the evidence, Santa&#x27;s statement as it stands, and the opposite of Jack Frost&#x27;s statement. Enter them in both grids as far as they go.<\/li><li><b>List the suspects.<\/b> Santa is out. Everybody else is in, Jack Frost included.<\/li><li><b>Clear suspects before you test them.<\/b> Compare each elf&#x27;s statement with the solid facts.<br>&ndash; If the facts already show the statement to be <b>true<\/b>, that elf is not the culprit, because the culprit&#x27;s statement is false.<br>&ndash; If the facts already show the statement to be <b>false<\/b>, that elf is the culprit, because an innocent elf tells the truth.<br>&ndash; This does not work for Jack Frost. His statement is false either way.<br>&ndash; Use the list of adjoining rooms. Between the snapshots a person moves at most into the room next door. So somebody who stands, at the discovery, in a room that neither is the target&#x27;s room nor adjoins it cannot have been in the target&#x27;s room at the incident, and is not the culprit. This needs the target&#x27;s room, which the discovery grid often gives you before any suspect is tested.<br>&ndash; Use the door logs as well. The culprit was the only person in the target&#x27;s room at the incident. A room that held exactly two people at the incident, or nobody, is not the target&#x27;s room, and nobody who stood in it is the culprit.<\/li><li><b>Test the remaining suspects one at a time.<\/b> Suppose this suspect is the culprit. Then:<br>&ndash; the suspect was in the target&#x27;s room at the incident, and nobody else was;<br>&ndash; the suspect&#x27;s statement is false (Jack&#x27;s is false anyway);<br>&ndash; every other elf&#x27;s statement is true. Fill in both grids with these extra facts, using everything from levels 1 to 3.<\/li><li><b>Look for the contradiction.<\/b> A wrong suspect breaks a rule sooner or later: a row that no figure can reach, two people forced into one column, a move into a room that is not adjoining. Count columns early: the culprit and the target stand in the same room and need two different columns (and two different rows) of it. If the room has only one column left that is still free, that room is impossible, and so is every suspect who would have to be there. Cross that suspect off and erase what you entered for them.<\/li><li><b>Exactly one suspect survives<\/b>, and for that suspect both grids can be completed in exactly one way.<\/li><\/ol><p>Practical advice: use a pencil, or one copy of the grids per suspect. Start with the suspect whose statement is the most precise, because its opposite will collide with the evidence fastest. And remember the two-grid link: a person cannot cross the floor between the snapshots, only step into the room next door.<\/p><p>If Jack Frost is the culprit, all the elves are telling the truth. If an elf is the culprit, there are two liars on the floor.<\/p>"},{"title":"11. The code grid and the password","html":"<h2 class=\"neu\">11. The code grid and the password<\/h2><p>Under every case there is a grid of characters, the same size as the map. When you have solved the case, find the square the culprit stands on and read the character on the same square of the code grid. In level 5, use the culprit&#x27;s square at the time of the incident.<\/p><p>Each case contributes one character. Case 01 gives the first character of the password, case 30 the last.<\/p><p><b>This is a password, not a word.<\/b><\/p><ul><li>It has exactly 30 characters, in case order.<\/li><li>It is case-sensitive: <code>a<\/code> and <code>A<\/code> are different characters.<\/li><li>It is random. It spells nothing, so you cannot guess a missing character from the ones you have, and you cannot tell from the password itself whether a character is wrong.<\/li><li>All 30 characters must be right. With 29 the vault stays shut.<\/li><\/ul><p>The characters used are capital letters, a few small letters and the digits 2 to 9. To keep the print unambiguous, the digits 0 and 1 and the letters I, O and small l never occur, and neither do the small letters that look like their capitals (c, k, o, p, s, u, v, w, x, z).<\/p><p>Because there is no way to check a single character, check each case before you move on:<\/p><ul><li>Does every row and every column hold exactly one figure?<\/li><li>Does every clue hold? Read them all once more against your finished grid.<\/li><li>Is exactly one person in the target&#x27;s room?<\/li><li>In level 5: did you read the code grid at the culprit&#x27;s <i>incident<\/i> square?<\/li><\/ul>"},{"title":"12. Questions that come up","html":"<h2>12. Questions that come up<\/h2><p><b>Do diagonals count as &quot;right next to&quot;?<\/b> No. Only squares that share an edge.<\/p><p><b>The figure is next to a fireplace, but there is a wall between them.<\/b> Then it is not &quot;right next to&quot; it. Both squares must be in the same room.<\/p><p><b>Is standing on a rug the same as being next to a rug?<\/b> No. &quot;On&quot; means on that square. &quot;Right next to&quot; means on a neighboring square.<\/p><p><b>Can the target stand on a walkable object?<\/b> Yes. The target follows the same placement rules as a person.<\/p><p><b>Does the target count as a person?<\/b> For rows and columns, yes: it takes up one of each. For everything else, no. Cameras do not record it, door logs do not count it, and it does not spoil &quot;the only person in the room&quot;.<\/p><p><b>Can Santa be in the target&#x27;s room?<\/b> No. Only one person is in the target&#x27;s room, that person is the culprit, and Santa is never the culprit. You never need this fact to solve a case, but you may use it.<\/p><p><b>Why is Santa&#x27;s laptop in the Storage Room?<\/b> Things get carried around. The target can be in any room, whatever its name suggests. Only the furniture is tied to its rooms.<\/p><p><b>There is no clue about where the target is.<\/b> That is intended. Place the people first; the target takes the row and column that are left. From level 2 on, some people have no clue either and are placed the same way.<\/p><p><b>I found two solutions.<\/b> Every case has exactly one. Check &quot;right next to&quot; (same room?), the halves (middle row or column on an odd map?), the direction clues (north is up, west is left), and in level 5 whether a move really goes to an adjoining room.<\/p><p><b>Do I have to solve the cases in order?<\/b> No, but the levels build on each other, the cases inside a level run from easier to harder, the story is told in order, and the password is read in case order.<\/p>"},{"title":"Credits","html":"<h2>Credits<\/h2><p>This is a fan-made, non-commercial puzzle collection. Santa&#x27;s elves, Jack Frost and the SANS Holiday Hack Challenge belong to the SANS Institute and Counter Hack. The puzzle format is inspired by Murdoku by Manuel Garand. This collection is not affiliated with or endorsed by either.<\/p>"}],"guideLevel":{"1":6,"2":7,"3":8,"4":9,"5":10}};</script><script>(function () {

  return out;

  var bin = atob(b64s), out = new Uint8Array(bin.length), ks = null;

/* Rules and clues                                                     */

var UNARY = { in_room: 1, not_in_room: 1, in_row: 1, in_col: 1, edge: 1, half: 1, on_obj: 1, beside_obj: 1,
  room_has: 1, cam_saw: 1, cam_not_saw: 1 };
var BINARY = { same_room: 1, not_same_room: 1, north_of: 1, south_of: 1, west_of: 1, east_of: 1 };

function cellName(c, z) { return String.fromCharCode(65 + z % c.n) + (Math.floor(z / c.n) + 1); }
function neighbours(c, z) {
  var n = c.n, r = Math.floor(z / n), q = z % n, out = [];
  if (r > 0) out.push(z - n); if (r < n - 1) out.push(z + n);
  if (q > 0) out.push(z - 1); if (q < n - 1) out.push(z + 1);
  return out;
}
function camAt(c, z) { for (var i = 0; i < c.cams.length; i++) if (c.cams[i].cell === z) return i; return -1; }
function isBlocked(c, z) { var o = c.objects[z]; return (o && o.blk) || camAt(c, z) >= 0; }
function roomName(c, z) { return c.rooms[c.room[z]].name; }

function posOf(c, b, f, t) {
  if (f === c.people.length) return b.g[0].f[f];
  return b.g[t].f[f];
}
function unaryOk(c, cl, z) {
  var n = c.n, r = Math.floor(z / n), q = z % n, h = Math.floor(n / 2), o = c.objects;
  switch (cl.k) {
    case 'in_room': return c.room[z] === cl.r;
    case 'not_in_room': return c.room[z] !== cl.r;
    case 'in_row': return r === cl.x;
    case 'in_col': return q === cl.x;
    case 'edge': return [r === 0, r === n - 1, q === 0, q === n - 1][cl.s];
    case 'half': return [r < h, r >= n - h, q < h, q >= n - h][cl.s];
    case 'on_obj': return !!o[z] && o[z].name === cl.o;

    for (f = 0; f <= P; f++) {
      var z = posOf(c, b, f, t);
      var r = Math.floor(z / n), q = z % n;

    }

      var pe = c.people[f], zz = b.g[0].f[f];
      if (c.access[pe.badge].indexOf(c.room[zz]) < 0)
        errs.push(pe.name + '’s ' + pe.badge + ' badge does not open the ' + roomName(c, zz) + '.');

  }
  if (c.T > 1) {
    for (f = 0; f < P; f++) {
      var r0 = c.room[b.g[0].f[f]], r1 = c.room[b.g[1].f[f]];
      if (r0 !== r1 && c.rooms[r0].adj.indexOf(r1) < 0)
        errs.push(c.people[f].name + ' cannot get from the ' + c.rooms[r0].name + ' to the ' + c.rooms[r1].name +
          ' between the snapshots: the rooms do not adjoin.');
    }
  }
  var inRoom = [];
  for (f = 0; f < P; f++) if (c.room[b.g[0].f[f]] === c.room[tz]) inRoom.push(f);
  var culprit = inRoom.length === 1 ? inRoom[0] : -1;
  if (inRoom.length === 0) errs.push('Nobody is in the same room as ' + c.target + (c.T > 1 ? ' at the time of the incident' : '') + '.');
  if (inRoom.length > 1) errs.push('More than one person is in the same room as ' + c.target + (c.T > 1 ? ' at the time of the incident' : '') + '.');
  if (culprit >= 0 && c.people[culprit].role === 'santa') errs.push('Santa is never the culprit.');
  var broken = [];
  c.clues.forEach(function (h) { if (!holds(c, b, h.c)) broken.push(h.nr); });
  var badStmt = [];
  if (culprit >= 0) {
    c.statements.forEach(function (s) {
      var role = c.people[s.who].role;
      var must = role === 'santa' ? true : role === 'frost' ? false : s.who !== culprit;
      if (holds(c, b, s.c) !== must) badStmt.push(s.who);
    });
  }
  return { ok: !errs.length && !broken.length && !badStmt.length && culprit >= 0, errs: errs,
    broken: broken, badStmt: badStmt, culprit: culprit };
}
function canon(c, b) {
  var P = c.people.length, parts = [];
  for (var t = 0; t < c.T; t++) {
    var a = [];
    for (var f = 0; f < P; f++) a.push(cellName(c, b.g[t].f[f]));
    parts.push(a.join(','));

function caseKey(c, b) { return sha256(enc('npif|' + c.nr + '|' + canon(c, b))); }

/* exported for the test harness */
window.NPIF_CORE = { validate: validate, canon: canon, caseKey: caseKey, decrypt: decrypt, sha256: sha256, hex: hex, enc: enc };
